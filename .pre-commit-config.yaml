repos:
  - repo: local
    hooks:
      - id: bump-demo-version
        name: Bump demo GAME_VERSION
        entry: auto_bump_version.sh
        language: script
        args: [demo, demo/index.html, GAME_VERSION]
        files: ^demo/index\.html$
        pass_filenames: false
        verbose: true

      - id: bump-webapp-version
        name: Bump webapp VERSION
        entry: auto_bump_version.sh
        language: script
        args: [webapp, webapp/src/apps/play/main.js, VERSION]
        files: ^webapp/
        pass_filenames: false
        verbose: true

      - id: unique-puzzles
        name: Check puzzle uniqueness in demo/GameOfDay/
        entry: python3 demo/GameOfDay/check_unique_puzzles.py
        language: system
        files: ^demo/GameOfDay/
        pass_filenames: false
