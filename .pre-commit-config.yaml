repos:
  - repo: local
    hooks:
      - id: bump-demo-version
        name: Bump GAME_VERSION in demo/index.html
        entry: demo/bump_demo_version.sh
        language: script
        files: ^demo/index\.html$
        pass_filenames: false
        verbose: true

      - id: unique-puzzles
        name: Check puzzle uniqueness in demo/GameOfDay/
        entry: python3 demo/GameOfDay/check_unique_puzzles.py
        language: system
        files: ^demo/GameOfDay/
        pass_filenames: false
