repos:
  - repo: local
    hooks:
      - id: bump-demo-version
        name: Bump demo GAME_VERSION
        entry: auto_bump_version.sh
        language: script
        args: [demo, demo/index.html, GAME_VERSION]
        files: ^demo/index\.html$
        pass_filenames: false
        verbose: true

      - id: bump-webapp-version
        name: Bump webapp VERSION
        entry: auto_bump_version.sh
        language: script
        args: [webapp, webapp/src/version.js, VERSION]
        files: ^webapp/(?!bench/|test/|tools/|src/version\.js$|package\.json$)
        pass_filenames: false
        verbose: true

      # After the bump hooks: it bumps VERSION itself only when the bump hook did not run.
      - id: refresh-labels
        name: Refit trap model + gotd-models after ratings/pairs change
        entry: webapp/tools/pre-commit-refresh.sh
        language: script
        args: [labels]
        files: ^webapp/tools/(ratings|pairs)\.json$
        pass_filenames: false
        verbose: true

      - id: refresh-bin-edge
        name: Regenerate Turso bin_edge (schema.sql)
        entry: webapp/tools/pre-commit-refresh.sh
        language: script
        args: [bin-edge]
        files: ^webapp/src/core/hist\.js$
        pass_filenames: false

      - id: refresh-bench-report
        name: Re-render bench/report.html from its template
        entry: webapp/tools/pre-commit-refresh.sh
        language: script
        args: [bench-report]
        files: ^webapp/bench/report\.template\.html$
        pass_filenames: false

      - id: unique-puzzles
        name: Check puzzles are distinct in demo/GameOfDay/ and its queue (up to rotation, reflection, reversed numbering)
        entry: node webapp/tools/gotd-gen.mjs check
        language: system
        files: ^demo/GameOfDay(-queue)?/
        pass_filenames: false
