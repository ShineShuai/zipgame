name = "zip-gotd"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# origins only (scheme + host + port, no path), comma separated; the http:// ones let `python3 -m http.server` on this machine read /stats
ALLOWED_ORIGIN = "https://shineshuai.github.io,http://localhost:8000,http://127.0.0.1:8000"
# secret, not a var (authorises POST /seed): npx wrangler secret put SEED_PLAYERS_SECRET < FILE   (value read from stdin: not an argument, see server/README.md)

[[d1_databases]]
binding = "DB"
database_name = "zip-gotd"
database_id = "433c6d55-64dc-42ad-81b2-38b0061299e1"
