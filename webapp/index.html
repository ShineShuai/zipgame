<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Zip</title>
<link rel="stylesheet" href="css/play.css">
</head>
<body>
<header class="app-bar">
  <div class="app-bar-inner">
    <a class="brand" href="../index.html" aria-label="Zip home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <use href="../assets/images/zip.svg" />
      </svg>
      <span>Zip</span>
    </a>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Mute sound effects" title="Mute sound effects">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="sound-waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="sound-x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
      </svg>
    </button>
  </div>
</header>
<div id="app"></div>
<div class="modal-backdrop" id="exportModal">
  <div class="modal">
    <h2>Export Puzzle</h2>
    <textarea id="exportText" spellcheck="false" readonly></textarea>
    <div class="modal-msg" id="exportMsg"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="exportClose">Close</button>
      <button class="btn" id="exportCopy">Copy to clipboard</button>
    </div>
  </div>
</div>
<script type="module" src="src/apps/play/main.js"></script>
</body>
</html>
