<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7ff">
<title>Zip</title>
<script>/* sets the theme before the first paint (src/ui/theme.js wires the button): the saved choice, else the system setting */
try{var t=localStorage.getItem('zip_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m&&t==='dark')m.setAttribute('content','#0d1224')}catch(e){}</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/play.css">
</head>
<body>
<header class="app-bar">
  <div class="app-bar-inner">
    <a class="brand" href="../index.html" aria-label="Zip home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <use href="../assets/images/logo/zip.svg" />
      </svg>
      <span>Zip</span>
    </a>
    <button class="icon-btn lang-toggle" id="langToggle" type="button" data-on="en" aria-label="Switch to Chinese" title="Switch to Chinese"><span>中</span></button>
    <button class="icon-btn sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Mute sound effects" title="Mute sound effects">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="sound-waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="sound-x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
      </svg>
    </button>
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="currentColor"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div id="app"></div>
<div class="modal-backdrop" id="exportModal">
  <div class="modal">
    <h2>Export Puzzle</h2>
    <textarea id="exportText" spellcheck="false" readonly></textarea>
    <div class="modal-msg" id="exportMsg"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="exportClose">Close</button>
      <button class="btn" id="exportCopy">Copy to clipboard</button>
    </div>
  </div>
</div>
<script type="module" src="src/apps/play/main.js"></script>
</body>
</html>
