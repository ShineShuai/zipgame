<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zip</title>
<style>
  html,body{margin:0;padding:0;background:#fff}
  #app{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:640px;margin:0 auto;color:#1a1a1a;padding:16px}
  .card{background:#fff;border:1px solid #e2e2e2;border-radius:12px;padding:20px;margin-bottom:14px}
  .btn{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:500}
  .btn:hover{background:#333}
  .btn.secondary{background:#fff;color:#1a1a1a;border:1px solid #ccc}
  .btn.secondary:hover{background:#f5f5f5}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=text]{border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:14px}
  select{border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:14px}
  .grid-wrap{display:flex;justify-content:center;margin:16px 0;user-select:none;-webkit-user-select:none;width:100%}
  .grid-wrap svg{max-width:100%}
  @media (max-width:480px){
    #app{padding:8px}
    .card{padding:12px}
  }
  .hud{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:10px}
  .hud b{color:#1a1a1a;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eee}
  th{color:#777;font-weight:500}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#eef;color:#334}
  .tag.done{background:#e3f5e6;color:#1a6e2c}
  .small{font-size:12px;color:#888}
  svg{touch-action:none;cursor:pointer;background:#fafafa;border-radius:8px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

// ---------- Version + hidden "v" reveal ----------
// Hold the "v" key to reveal the version number badge and the hint button;
// release it (or blur the window) and both hide again.
const GAME_VERSION = '0.0.1';

// ---------- Hamiltonian-path grid generator (randomized Warnsdorff + wall-based uniqueness) ----------
const DIRS4 = [[0,1],[0,-1],[1,0],[-1,0]];

function edgeKey(a,b){ return a<b ? a+'_'+b : b+'_'+a; }

// ---------- Daily deterministic puzzle sequence ----------
// Every UTC day has a fixed, ordered sequence of puzzles per grid size N:
// the seed for "puzzle #k of the day" is derived purely from (UTC date, N, k),
// so the same day always produces the same puzzles in the same order for
// everyone, independent of client clock/timezone quirks (we use UTC fields).
function utcDayNumber(){
  const now = new Date();
  return Math.floor(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000);
}
// Simple deterministic hash combining day/N/index into a 32-bit seed.
function dailySeed(dayNum, N, index){
  let h = 0x811c9dc5 >>> 0; // FNV-1a offset basis
  [dayNum, N, index].forEach(v=>{
    h ^= v >>> 0;
    h = Math.imul(h, 0x01000193) >>> 0;
  });
  return h >>> 0;
}

// Randomized Warnsdorff's rule: at each step, move to the unvisited neighbor
// with the fewest onward options (ties broken randomly). O(N^2) per attempt,
// no recursive backtracking, succeeds almost always in one pass.
function warnsdorffPath(N, rnd){
  const cells = N*N;
  function idx(r,c){return r*N+c;}
  function onwardDegree(r,c,visited){
    let cnt=0;
    for(const [dr,dc] of DIRS4){
      const nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&!visited[idx(nr,nc)]) cnt++;
    }
    return cnt;
  }
  const visited = new Array(cells).fill(false);
  const order = [];
  let r = Math.floor(rnd()*N), c = Math.floor(rnd()*N);
  visited[idx(r,c)] = true;
  order.push(idx(r,c));
  for(let step=1; step<cells; step++){
    const cands = [];
    for(const [dr,dc] of DIRS4){
      const nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&!visited[idx(nr,nc)]){
        cands.push([nr,nc,onwardDegree(nr,nc,visited)]);
      }
    }
    if(cands.length===0) return null; // dead end
    cands.sort((a,b)=>a[2]-b[2]);
    const minDeg = cands[0][2];
    const best = cands.filter(x=>x[2]===minDeg);
    const [nr,nc] = best[Math.floor(rnd()*best.length)];
    r=nr; c=nc;
    visited[idx(r,c)] = true;
    order.push(idx(r,c));
  }
  return order;
}

// Count Hamiltonian paths that (a) exist entirely within `open` edges (grid edges
// minus walls) and (b) visit numbered checkpoints in increasing order, starting
// at the cell numbered 1 and ending at the cell numbered max. Stops early once
// `cap` solutions are found (we only ever need to know if count > 1).
function countSolutions(N, numbers, open, cap, nodeCap, capturePaths){
  const cells = N*N;
  function idx(r,c){return r*N+c;}
  // Open-edge bitmask: bit d (matching DIRS4[d]) set means that direction is
  // open from this cell. Built once per call from the `open` Set (still the
  // simple, caller-facing representation used everywhere outside the hot
  // DFS loop — wall-adding just adds/removes strings from a Set, unchanged).
  // Replaces edgeKey()+Set.has() in the hot loop below: string concatenation
  // + hash lookup measured ~30x slower than a Uint8Array bit-test per call
  // (358ms vs 12ms for 5M lookups) — this is the dominant per-node DFS cost,
  // so this directly targets what's actually slow about generation. Build
  // cost is O(cells*4), negligible next to nodeCap (up to 2,000,000).
  const openMask = new Uint8Array(cells);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i = idx(r,c);
    for(let d=0; d<DIRS4.length; d++){
      const [dr,dc] = DIRS4[d];
      const nr=r+dr, nc=c+dc;
      if(nr<0||nr>=N||nc<0||nc>=N) continue;
      const j = idx(nr,nc);
      if(open.has(edgeKey(i,j))) openMask[i] |= (1<<d);
    }
  }
  // Reusable scratch buffer for neighbor lookups — avoids allocating a new
  // array on every DFS node visited (this was the main GC pressure source,
  // since dfs() can visit hundreds of thousands of nodes per call). Indexed
  // by recursion depth since a naive single shared buffer would be clobbered
  // by the recursive call before the parent finishes iterating it.
  const nbrBuf = new Int32Array(cells*4);
  function neighborsInto(i, depth){
    const r = Math.floor(i/N), c = i%N;
    const base = depth*4;
    let n = 0;
    for(let d=0; d<DIRS4.length; d++){
      if(!(openMask[i] & (1<<d))) continue;
      const [dr,dc] = DIRS4[d];
      const nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N){
        nbrBuf[base+n++] = idx(nr,nc);
      }
    }
    return n; // number of valid neighbors written into nbrBuf[base..base+n)
  }
  const numCells = Object.keys(numbers).map(Number);
  const startCell = numCells.find(i=>numbers[i]===1);
  const maxNum = Math.max(...numCells.map(i=>numbers[i]));
  const endCell = numCells.find(i=>numbers[i]===maxNum);

  // cell -> row/col for O(1) Manhattan distance in the reachability bound
  const rowOf = new Int32Array(cells), colOf = new Int32Array(cells);
  for(let i=0;i<cells;i++){ rowOf[i]=Math.floor(i/N); colOf[i]=i%N; }
  // number -> cell index, for the Manhattan bound to the next checkpoint
  const posOfNum = new Int32Array(maxNum+1).fill(-1);
  numCells.forEach(i=>{ posOfNum[numbers[i]] = i; });

  let found = 0;
  const visited = new Array(cells).fill(false);
  let nodes = 0;
  const NODE_CAP = nodeCap || 200000; // bail out (treat as "too many/uncertain") on pathological cases
  // scratch path buffer (cell index per depth) + captured solutions, only
  // touched when capturePaths is set — zero overhead otherwise
  const pathBuf = capturePaths ? new Int32Array(cells) : null;
  const paths = capturePaths ? [] : null;

  // scratch flood-fill stack/stamp buffers, reused across calls to avoid
  // per-node allocation (same rationale as nbrBuf above)
  const seen = new Int32Array(cells);
  const stack = new Int32Array(cells);
  let stamp = 0;

  // full flood-fill: remaining unvisited region must stay single connected
  // blob of exactly the size still needed (catches splits the local check
  // below can't see, e.g. two degree-2 cells fencing off a pocket)
  function connectivityOk(cur, remaining){
    stamp++;
    let sp = 0;
    stack[sp++] = cur;
    seen[cur] = stamp;
    let cnt = 0;
    while(sp > 0){
      const u = stack[--sp];
      const r = rowOf[u], c = colOf[u];
      for(let d=0; d<DIRS4.length; d++){
        if(!(openMask[u] & (1<<d))) continue;
        const [dr,dc] = DIRS4[d];
        const nr=r+dr, nc=c+dc;
        if(nr<0||nr>=N||nc<0||nc>=N) continue;
        const v = idx(nr,nc);
        if(visited[v] || seen[v]===stamp) continue;
        seen[v] = stamp;
        cnt++;
        stack[sp++] = v;
      }
    }
    return cnt === remaining;
  }

  // cheap local dead-end check: only cells adjacent to `cur` can have changed
  // degree this step (cur just got visited), so only rescan those — O(degree)
  // instead of rescanning the whole board every node.
  function noLocalDeadEnds(cur, depth){
    const n = neighborsInto(cur, depth);
    const base = depth*4;
    for(let k=0;k<n;k++){
      const u = nbrBuf[base+k];
      if(visited[u]) continue;
      // free degree of u: count cur itself as still "free" even though
      // visited[cur] is already true — cur is u's neighbor we just arrived
      // from, and excluding it here would undercount (cur isn't a trap for
      // u, it's u's connection back to the live path). Without this
      // exemption every cell adjacent to the just-visited cell looks like
      // it lost a degree it never actually needed.
      const ur = rowOf[u], uc = colOf[u];
      let free = 0;
      for(let d=0; d<DIRS4.length; d++){
        if(!(openMask[u] & (1<<d))) continue;
        const [dr,dc] = DIRS4[d];
        const nr=ur+dr, nc=uc+dc;
        if(nr<0||nr>=N||nc<0||nc>=N) continue;
        const v = idx(nr,nc);
        if(visited[v] && v!==cur) continue;
        free++;
      }
      if(free===0) return false;
      if(free===1 && u!==endCell) return false;
    }
    return true;
  }

  function dfs(cell, count, nextNeeded, depth){
    nodes++;
    if(nodes>NODE_CAP || found>=cap) return;
    visited[cell] = true;
    if(pathBuf) pathBuf[depth] = cell;
    let needed = nextNeeded;
    if(numbers[cell] !== undefined){
      if(numbers[cell] !== needed){ visited[cell]=false; return; }
      needed++;
    }
    if(count === cells){
      if(cell === endCell && needed === maxNum+1){
        found++;
        if(paths) paths.push(Array.from(pathBuf)); // snapshot; pathBuf gets reused
      }
      visited[cell] = false;
      return;
    }

    // cheapest prune first: local degree check (O(degree), no flood-fill)
    if(!noLocalDeadEnds(cell, depth)){ visited[cell]=false; return; }
    const remaining = cells - count; // cells still needing a visit
    if(!connectivityOk(cell, remaining)){ visited[cell]=false; return; }

    const n = neighborsInto(cell, depth);
    const base = depth*4;
    // Manhattan bound + Warnsdorff ordering over surviving candidates
    const stepsLeft = remaining; // moves available before the board is full
    const cands = []; // [cellIdx, onwardDegree]
    for(let k=0;k<n;k++){
      const nb = nbrBuf[base+k];
      if(visited[nb]) continue;
      const m = numbers[nb];
      if(m !== undefined && m !== needed) continue; // wrong checkpoint
      // Manhattan bound: next required checkpoint must be reachable within
      // the cells remaining, else this branch can never complete
      if(needed <= maxNum){
        const tgt = posOfNum[needed];
        if(tgt >= 0){
          const dist = Math.abs(rowOf[nb]-rowOf[tgt]) + Math.abs(colOf[nb]-colOf[tgt]);
          if(dist > stepsLeft) continue;
        }
      }
      // onward free-degree of nb for Warnsdorff ordering
      const nbr = rowOf[nb], nbc = colOf[nb];
      let deg = 0;
      for(let d=0; d<DIRS4.length; d++){
        if(!(openMask[nb] & (1<<d))) continue;
        const [dr,dc] = DIRS4[d];
        const nr=nbr+dr, nc=nbc+dc;
        if(nr<0||nr>=N||nc<0||nc>=N) continue;
        const v = idx(nr,nc);
        if(visited[v]) continue;
        deg++;
      }
      cands.push([nb, deg]);
    }
    cands.sort((a,b)=>a[1]-b[1]); // visit most-constrained cell first

    for(let k=0;k<cands.length;k++){
      dfs(cands[k][0], count+1, needed, depth+1);
      if(found>=cap || nodes>NODE_CAP) break;
    }
    visited[cell] = false;
  }
  dfs(startCell, 1, 1, 0);
  return { count: found, exceeded: nodes>NODE_CAP, paths: paths || undefined };
}

// Edge set used by a path (array of cell indices in visit order).
function pathEdgeSet(path){
  const s = new Set();
  for(let i=1;i<path.length;i++) s.add(edgeKey(path[i-1], path[i]));
  return s;
}

// Grid edges depend only on N, not on the random path — cache per N instead
// of rebuilding this Set on every tryGeneratePuzzle call (was a steady
// allocation source across repeated attempts/generations).
const allEdgesCache = {};
function allEdgesFor(N){
  if(allEdgesCache[N]) return allEdgesCache[N];
  function idx(r,c){return r*N+c;}
  const allEdges = new Set();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i = idx(r,c);
    if(c+1<N) allEdges.add(edgeKey(i, idx(r,c+1)));
    if(r+1<N) allEdges.add(edgeKey(i, idx(r+1,c)));
  }
  allEdgesCache[N] = allEdges;
  return allEdges;
}

// Try one (path, wall-order) combination for a FIXED K. Returns null if it
// can't be made unique within nodeCap search cost; otherwise a valid puzzle.
// wallBudget caps how many walls we're willing to add before giving up on
// this attempt (bounds worst-case cost: wallBudget * nodeCap DFS nodes).
// Purely deterministic given (N, K, rnd's state, nodeCap, wallBudget) — same
// seed always produces the same puzzle, regardless of machine speed. No
// wall-clock timing enters the algorithm anywhere.
// onWallStep (optional, may be async) is awaited after each wall-loop
// iteration with the current wall count — purely a responsiveness hook so
// an async caller can yield to the event loop partway through a single long
// attempt (a single attempt's wall loop can itself run for several seconds
// at larger N; this lets the page repaint partway through instead of
// looking frozen). It never influences what gets computed or in what order
// — only WHEN the browser gets a chance to breathe while getting there.
// tryGeneratePuzzle is async so it can genuinely await that yield (a plain
// synchronous callback can never hand control back to the event loop, no
// matter what it does internally) — every call site must now await it, but
// with onWallStep omitted it still runs start-to-finish with no actual
// suspension, so callers that don't need yielding (like the sync-style
// genPuzzle wrapper below) are unaffected beyond adding `await`.
async function tryGeneratePuzzle(N, K, rnd, nodeCap, wallBudget, onWallStep){
  const path = warnsdorffPath(N, rnd);
  if(!path) return null;

  // Path-anchored, gap-targeted checkpoint placement: pick K positions ALONG
  // the path (every checkpoint is guaranteed reachable in visit order, since
  // it's a point on a path already known to be Hamiltonian), inserted one at
  // a time to keep each new checkpoint's grid (Manhattan) distance to its
  // immediate visit-order neighbors close to a TARGET gap — not maximized.
  // Maximizing spread (tried first) forces consecutive checkpoints far apart
  // in grid space while leaving only a few path steps between them, which
  // makes the segment barely feasible (near-zero slack) and blows up the
  // solver's search; targeting a moderate, bounded gap avoids that while
  // still fixing the original bug (arc-length sampling of a winding path
  // let consecutive checkpoints land on adjacent/idling cells with wildly
  // uneven, arbitrary-looking spacing). Endpoints are always checkpoints
  // 1 and K, matching the puzzle's start/end.
  const rowOfCell = i=>Math.floor(i/N), colOfCell = i=>i%N;
  const manhattan = (a,b)=>Math.abs(rowOfCell(a)-rowOfCell(b))+Math.abs(colOfCell(a)-colOfCell(b));
  // Target gap scales with how much path is actually available per segment
  // — NOT a fixed fraction of the grid diagonal. A fixed target (e.g. 0.2 *
  // grid-diagonal) is wrong at low K: with few checkpoints there's a lot of
  // path per segment (e.g. ~9 steps/segment at K=10 on a 9x9), so a small
  // fixed target pulls checkpoints artificially close together — the exact
  // "always clustered" symptom this is fixing. TARGET_GAP_FRAC is instead a
  // fraction of the mean steps-per-segment, so the target scales with K:
  // fewer checkpoints → farther apart; more checkpoints → closer together,
  // proportionally either way. 0.65 leaves the solver slack (segment isn't
  // forced to its tightest possible route) while still keeping spacing
  // meaningfully even rather than arc-length's idle-clustering artifact.
  const avgStepsPerSegment = (path.length-1) / (K-1);
  const TARGET_GAP_FRAC = 0.65;
  const targetGap = TARGET_GAP_FRAC * avgStepsPerSegment;
  const checkpointIdx = [0, path.length-1]; // path positions, kept sorted (=visit order)
  const chosenPos = new Set(checkpointIdx);
  while(checkpointIdx.length < K){
    let bestP = -1, bestScore = Infinity, bestInsertAt = -1;
    for(let p=0;p<path.length;p++){
      if(chosenPos.has(p)) continue;
      // locate insertion slot (checkpointIdx stays sorted by path position)
      let lo=0; while(lo<checkpointIdx.length && checkpointIdx[lo]<p) lo++;
      const predPos = checkpointIdx[lo-1], succPos = checkpointIdx[lo];
      const stepsToPred = p - predPos, stepsToSucc = succPos - p;
      const manToPred = manhattan(path[predPos], path[p]);
      const manToSucc = manhattan(path[p], path[succPos]);
      // hard feasibility constraint: can't require more grid-distance than
      // there are path steps available to cover it (same bound the solver's
      // own Manhattan-distance prune enforces)
      if(manToPred > stepsToPred || manToSucc > stepsToSucc) continue;
      // score: how far both new segments are from the target gap (squared
      // deviation, lower is better) — pulls consecutive-checkpoint spacing
      // toward "evenly paced", not toward "maximally far apart"
      const score = (manToPred-targetGap)**2 + (manToSucc-targetGap)**2;
      if(score < bestScore){ bestScore = score; bestP = p; bestInsertAt = lo; }
    }
    if(bestP < 0) break; // no feasible insertion left for this path; caller retries with a new attempt
    checkpointIdx.splice(bestInsertAt, 0, bestP);
    chosenPos.add(bestP);
  }
  if(checkpointIdx.length < K) return null; // couldn't place all K checkpoints feasibly on this path
  const numbers = {};
  checkpointIdx.forEach((pos,i)=>{ numbers[path[pos]] = i+1; });

  const allEdges = allEdgesFor(N);
  const maxWalls = wallBudget==null ? allEdges.size : wallBudget;

  // Hybrid wall-adding: the ideal method is precise diff-edge walling (find
  // 2 solutions, wall an edge that's in one but not the other). Naively this
  // seems to guarantee the solution count never reaches 0 (the "other"
  // solution is untouched by that specific wall) — but that guarantee only
  // holds WITHIN one iteration. Each iteration re-solves from scratch with
  // no memory of prior solutions, so the next iteration's pair can be
  // entirely different from this one's survivor, and a wall picked to be
  // "safe" relative to THIS iteration's pair can still land on an edge a
  // PREVIOUS iteration's survivor needed — silently destroying it a few
  // steps later (confirmed in practice: real attempts hit count=0 and then
  // wasted dozens of further full-cost solves before giving up). The fix is
  // to anchor every wall choice — in both phases — to the ONE original
  // reference path for the whole attempt, never walling any of its edges;
  // that path is guaranteed to always remain a valid solution, so the count
  // genuinely never reaches 0. On a still-wide-open grid the solver can
  // exceed nodeCap before even enumerating 2 solutions, and diff-edge
  // walling has nothing to work with in that case. So: while the search is
  // too open (exceeded), shrink it with a cheap generic wall (any anchor-
  // path edge excluded, in random order — same fallback the old algorithm
  // always used); once a solve completes, switch to precise diff-edge walls
  // (also anchor-excluded) for the rest. This keeps wall count low on the
  // (common) case where the puzzle is already close to unique, while still
  // converging on harder/more-open instances that pure diff-edge walling
  // can't get started on.
  const pathEdges = pathEdgeSet(path);
  const genericPool = [...allEdges].filter(e=>!pathEdges.has(e));
  for(let i=genericPool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [genericPool[i],genericPool[j]]=[genericPool[j],genericPool[i]]; }
  let gwi = 0;
  const walls = new Set();
  let open = new Set(allEdges);

  // Deterministic upfront seeding: place a fixed fraction of genericPool's
  // ALREADY-shuffled edges as walls before the adaptive probe loop even
  // starts, instead of letting that loop discover — one cheap probe at a
  // time — that a wide-open board needs dozens of walls anyway. Measured
  // (design.html, same solver core, N=9, K=4-7, no walls initially): seeding
  // ~40-50% of genericPool upfront cuts total solver nodes by 80%+ and wall-
  // clock by a similar margin versus growing the wall set one edge at a
  // time from empty, with NO cost to final puzzle quality — a single
  // minimize-style pass after reaching uniqueness converges to about the
  // same final wall count regardless of how many walls were seeded
  // upfront (that pass isn't implemented here yet; genPuzzleAsync still
  // returns whatever the diff-edge loop below converges to, same as before
  // this change — the win here is purely in how fast it GETS there).
  // This draws NO new rnd() calls: genericPool was already shuffled from
  // `rnd` above, so taking a prefix of it is itself a deterministic,
  // rnd-derived choice, and every call site already passes the whole
  // wall-loop's random decisions through this one `rnd` stream — seeding
  // from a prefix of an already-`rnd`-shuffled array keeps the same-seed-
  // same-puzzle guarantee (Game of Day included) intact with no extra
  // bookkeeping. gwi starts past the seeded prefix so the probe/diff-edge
  // loops below never reconsider an already-placed wall.
  const SEED_FRACTION = 0.4;
  const seedCount = Math.min(Math.floor(genericPool.length * SEED_FRACTION), maxWalls);
  for(let i=0;i<seedCount;i++){
    walls.add(genericPool[i]);
    open.delete(genericPool[i]);
  }
  gwi = seedCount;
  if(onWallStep && seedCount>0) await onWallStep(walls.size);

  // Adaptive pre-seeding: a full-nodeCap, capturePaths solve on a wide-open
  // grid (checkpoints only, no walls yet) is expensive — often 150-250ms+ at
  // N=9, and often still ends up `exceeded` anyway, so that cost is wasted.
  // Before paying for it, probe with a much cheaper nodeCap (capped low,
  // capturePaths off since we only need exceeded/not here) and add cheap
  // generic walls one at a time for as long as even the cheap probe still
  // exceeds — this quickly shrinks a too-open grid using many inexpensive
  // calls instead of few expensive ones. Once the probe stops exceeding
  // (search has become small enough to be tractable), switch to the real
  // nodeCap with capturePaths for precise diff-edge walling, same as before.
  // With the deterministic seeding above already placed, this loop usually
  // has little or nothing left to do — it remains as a fallback for
  // whatever the fixed fraction doesn't happen to cover on a given puzzle.
  const PROBE_CAP = Math.min(nodeCap, 4000);
  let probe = countSolutions(N, numbers, open, 2, PROBE_CAP, false);
  while(probe.exceeded && gwi < genericPool.length && walls.size < maxWalls){
    walls.add(genericPool[gwi]);
    open.delete(genericPool[gwi]);
    gwi++;
    probe = countSolutions(N, numbers, open, 2, PROBE_CAP, false);
    if(onWallStep) await onWallStep(walls.size);
  }

  let res = countSolutions(N, numbers, open, 2, nodeCap, true);
  while((res.count > 1 || res.exceeded) && walls.size < maxWalls){
    if(res.count === 0){
      // The anchor path should make this unreachable (see comment above the
      // wall-adding loop), but if it ever happens, no further wall can help
      // — every wall only removes edges, so a puzzle with zero solutions
      // stays at zero. Bail immediately instead of burning more full-nodeCap
      // solves hoping it recovers.
      return null;
    }
    let wall = null;
    if(res.exceeded){
      while(gwi < genericPool.length && walls.has(genericPool[gwi])) gwi++;
      if(gwi < genericPool.length) wall = genericPool[gwi++];
    } else {
      const [pathA, pathB] = res.paths;
      const edgesA = pathEdgeSet(pathA), edgesB = pathEdgeSet(pathB);
      // Exclude the ORIGINAL anchor path's edges here too, not just A's/B's
      // difference — pathA/pathB are whichever two solutions THIS solve
      // happened to return, not necessarily the anchor, so a naive A\B wall
      // can land on an edge the anchor itself needs. That silently breaks
      // the "some solution always survives" guarantee a few iterations
      // later (confirmed: this caused long count=0 stalls in practice).
      // Anchoring every wall choice to the one fixed reference path for the
      // whole attempt is what actually makes the guarantee hold.
      let diffEdges = [...edgesA].filter(e=>!edgesB.has(e) && !pathEdges.has(e));
      if(diffEdges.length === 0) diffEdges = [...edgesB].filter(e=>!edgesA.has(e) && !pathEdges.has(e));
      if(diffEdges.length) wall = diffEdges[Math.floor(rnd()*diffEdges.length)];
    }
    if(wall === null) return null; // exhausted both wall sources without reaching uniqueness
    walls.add(wall);
    open.delete(wall);
    res = countSolutions(N, numbers, open, 2, nodeCap, true);
    if(onWallStep) await onWallStep(walls.size);
  }
  const { count, exceeded } = res;
  if(count !== 1 || exceeded) return null;

  return { N, path, numbers, walls: [...walls] };
}

// Async puzzle generation with progress reporting: runs attempts one at a
// time, yielding to the event loop after each so the UI can repaint a
// progress indicator, and keeps searching for the full attempt budget even
// after finding a valid puzzle, since walls only ever improve or tie.
// onProgress(fraction) is called with 0..1 as the search progresses.
// attemptBudget (optional) overrides the default number of tryGeneratePuzzle
// attempts to make at the chosen K before falling back — this is a count,
// not a time limit, so the same seed always does the same amount of work
// and produces the same puzzle regardless of machine speed. Wall-clock time
// to finish can vary (slower machines take longer), but the RESULT never
// does, and the caller always sees live progress via onProgress rather than
// the page going quiet for an unbounded stretch.
async function genPuzzleAsync(size, seed, attemptBudget, onProgress, retryDepth){
  retryDepth = retryDepth || 0;
  const N = size;
  const cells = N*N;
  // Default attempt budgets per N: scaled so smaller grids (cheap per
  // attempt) get many tries and larger grids (expensive per attempt) get
  // fewer — chosen empirically so the common case finds a real puzzle
  // well before the fallback tiers below are needed.
  const DEFAULT_ATTEMPT_BUDGETS = { 5: 200, 7: 60, 9: 30, 11: 15, 16: 8 };
  attemptBudget = attemptBudget || DEFAULT_ATTEMPT_BUDGETS[N] || Math.max(20, Math.round(6000/cells));

  let s = seed >>> 0;
  function rnd(){ s = (s*1664525+1013904223)>>>0; return s/4294967296; }
  const nodeCap = Math.max(30000, 200*cells); // per-attempt search budget; keeps individual attempts fast

  // Pick K once, up front, uniformly from [N, cells/4] — then spend the whole
  // attempt budget searching only within that K for the minimum-wall puzzle,
  // rather than letting the search drift toward whichever K needs less work.
  const Kmin = Math.max(4, N);
  const Kmax = Math.max(Kmin+1, Math.round(cells/4));
  const K = Kmin + Math.floor(rnd()*(Kmax-Kmin+1));

  let best = null;
  // Yield to the event loop (and report progress) every YIELD_EVERY
  // attempts, AND periodically DURING a single attempt via onWallStep below
  // — both are fixed COUNTS, not time windows, so this never changes what
  // gets computed, only how often the UI gets a chance to repaint. A single
  // attempt's wall-adding loop can itself run for several seconds at larger
  // N with nothing in between to yield on otherwise, which is what made the
  // page look frozen even after attempt-level yielding was added.
  const YIELD_EVERY = 1;
  const WALL_STEP_YIELD_EVERY = 4; // yield every few walls added mid-attempt

  const onWallStep = async (wallCount) => {
    if((wallCount % WALL_STEP_YIELD_EVERY) === 0){
      if(onProgress) onProgress(null, wallCount, K); // null frac: mid-attempt, overall fraction unchanged
      await new Promise(r=>setTimeout(r,0));
    }
  };

  outer:
  for(let attempt=0; attempt<attemptBudget; attempt++){
    const result = await tryGeneratePuzzle(N, K, rnd, nodeCap, cells, onWallStep);
    if(result && (!best || result.walls.length < best.walls.length)){
      best = result;
      if(best.walls.length === 0) break outer; // can't do better than zero walls
    }
    if((attempt % YIELD_EVERY) === 0 || attempt === attemptBudget-1){
      if(onProgress){
        const frac = Math.min(1, (attempt+1)/attemptBudget);
        onProgress(frac, best ? best.walls.length : null, K);
      }
      await new Promise(r=>setTimeout(r,0)); // yield to event loop / UI repaint
    }
  }

  // Guarantee: if nothing valid was found within the attempt budget (unlucky
  // seed/grid/K combo), fall back to a MORE GENEROUS search at the SAME K —
  // still a fixed, deterministic attempt count, just with a larger per-
  // attempt nodeCap. Progress keeps reporting through this phase so the UI
  // never goes quiet, however long it actually takes on this machine.
  if(!best){
    const fallbackNodeCap = Math.min(2000000, Math.max(300000, 20*nodeCap));
    const FALLBACK_ATTEMPTS = 4;
    for(let fb=0; fb<FALLBACK_ATTEMPTS && !best; fb++){
      best = await tryGeneratePuzzle(N, K, rnd, fallbackNodeCap, cells, onWallStep);
      if(onProgress) onProgress(1, best ? best.walls.length : null, K); // keep the UI updated through fallback, not just the main loop
      await new Promise(r=>setTimeout(r,0)); // yield between fallback tries
    }
  }
  if(!best){
    // Still nothing after bounded fallback attempts: reseed with a fresh
    // path/K rather than retrying this same (likely pathological) K forever.
    // retryDepth is a plain recursion-depth counter — deterministic, no
    // wall-clock timing involved — so the SAME seed always takes the SAME
    // path through this retry logic.
    if(retryDepth >= 5){
      // Last resort: K = Kmax (densest allowed), which empirically needs
      // few/no walls and resolves almost instantly — guarantees termination
      // in the common case. But it CAN still fail on a pathological seed —
      // when it does, we must stop here rather than recurse again, or
      // retryDepth would climb unbounded and eventually overflow the call
      // stack (this was a real, confirmed bug: retryDepth climbed past
      // 1000+ before crashing, because nothing previously stopped the
      // fall-through to another recursive call after a dense-K failure).
      const denseAttempt = await tryGeneratePuzzle(N, Kmax, rnd, Math.max(300000,20*nodeCap), cells, onWallStep);
      if(denseAttempt) return withWallSet({ ...denseAttempt, seed });
      // Absolute last resort: number EVERY cell along a fresh Hamiltonian
      // path (K=cells), not just the two endpoints. This is the genuinely
      // trivial case — with every cell numbered, exactly one move is legal
      // at each step, so it resolves in O(cells) with a single solution by
      // construction. (An earlier version of this fallback used K=2 — only
      // start/end checkpoints — on the mistaken assumption that fewer
      // checkpoints means an easier search; it's the opposite: the
      // Manhattan-bound pruning that keeps the DFS tractable barely
      // constrains anything when the only checkpoint is ~cells steps away,
      // so K=2 on an 11x11 grid failed to even complete at 500,000 nodes.
      // K=cells verified at 11ms with count=1.) This cannot itself fail to
      // produce a valid puzzle for any successfully-constructed path.
      const trivialPath = warnsdorffPath(N, rnd);
      if(trivialPath){
        const trivialNumbers = {};
        trivialPath.forEach((cell,i)=>{ trivialNumbers[cell] = i+1; });
        return withWallSet({ N, path: trivialPath, numbers: trivialNumbers, walls: [], seed });
      }
      // Even warnsdorffPath can fail on a bad rnd draw (rare, dead-end
      // during construction) — try a few more seeds directly rather than
      // recursing (recursing here risks the same unbounded-depth problem
      // this block exists to prevent).
      for(let extra=0; extra<10; extra++){
        const retryPath = warnsdorffPath(N, rnd);
        if(retryPath){
          const retryNumbers = {};
          retryPath.forEach((cell,i)=>{ retryNumbers[cell] = i+1; });
          return withWallSet({ N, path: retryPath, numbers: retryNumbers, walls: [], seed });
        }
      }
      // Should be unreachable for any valid N>=2 (warnsdorffPath only
      // returns null on a dead-end mid-construction, and random restarts
      // resolve that within a handful of tries in practice) — but never
      // leave the caller hanging on an unresolved promise.
      throw new Error('Puzzle generation failed: could not construct any Hamiltonian path for N='+N);
    }
    return genPuzzleAsync(size, seed+1, attemptBudget, onProgress, retryDepth+1);
  }

  if(onProgress) onProgress(1, best.walls.length, K);
  return withWallSet({ ...best, seed });
}

// Synchronous wrapper kept for any caller that can't await (none currently,
// but useful for quick console testing) — runs the whole attempt budget in
// one go, deterministically (same seed, same result, regardless of speed).
// async only because tryGeneratePuzzle is (no yielding happens here; this
// wrapper has no UI to keep responsive, so it never passes onWallStep).
async function genPuzzle(size, seed, attemptBudget){
  const N = size;
  const cells = N*N;
  const DEFAULT_ATTEMPT_BUDGETS = { 5: 200, 7: 60, 9: 30, 11: 15, 16: 8 };
  attemptBudget = attemptBudget || DEFAULT_ATTEMPT_BUDGETS[N] || Math.max(20, Math.round(6000/cells));

  let s = seed >>> 0;
  function rnd(){ s = (s*1664525+1013904223)>>>0; return s/4294967296; }
  const nodeCap = Math.max(30000, 200*cells);

  const Kmin = Math.max(4, N);
  const Kmax = Math.max(Kmin+1, Math.round(cells/4));
  const K = Kmin + Math.floor(rnd()*(Kmax-Kmin+1));

  let best = null;
  for(let attempt=0; attempt<attemptBudget; attempt++){
    const result = await tryGeneratePuzzle(N, K, rnd, nodeCap, cells);
    if(result && (!best || result.walls.length < best.walls.length)){
      best = result;
      if(best.walls.length === 0) break;
    }
  }
  if(!best){
    const fallbackNodeCap = Math.min(2000000, Math.max(300000, 20*nodeCap));
    for(let fb=0; fb<4 && !best; fb++){
      best = await tryGeneratePuzzle(N, K, rnd, fallbackNodeCap, cells);
    }
  }
  if(!best) return genPuzzle(size, seed+1, attemptBudget);
  return withWallSet({ ...best, seed });
}

// Attach a non-enumerable, non-serialized Set for O(1) wall lookups.
// (walls array stays the source of truth for JSON storage/online sync)
function withWallSet(puzzle){
  Object.defineProperty(puzzle, 'wallSet', {
    value: new Set(puzzle.walls||[]),
    enumerable: false
  });
  return puzzle;
}

// ---------- Game of Day: load a puzzle from plain-text data ----------
// Format:
//   size N
//   checkpoints r,c=n ...   (0-based)
//   walls T,r,c ...         (T=H spans (r,c)-(r+1,c); T=V spans (r,c)-(r,c+1))
function parseGameOfDay(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#'));
  let N=null, numbers={}, walls=[];
  for(const line of lines){
    const [key, ...rest] = line.split(/\s+/);
    const body = rest.join(' ');
    if(key==='size'){
      N = parseInt(body, 10);
    } else if(key==='checkpoints'){
      body.split(/\s+/).filter(Boolean).forEach(tok=>{
        const m = tok.match(/^(\d+),(\d+)=(\d+)$/);
        if(!m) throw new Error('bad checkpoint token: '+tok);
        numbers[parseInt(m[1],10)*N + parseInt(m[2],10)] = parseInt(m[3],10);
      });
    } else if(key==='walls'){
      body.split(/\s+/).filter(Boolean).forEach(tok=>{
        const m = tok.match(/^([HV]),(\d+),(\d+)$/);
        if(!m) throw new Error('bad wall token: '+tok);
        const T=m[1], r=parseInt(m[2],10), c=parseInt(m[3],10);
        const a = r*N+c;
        const b = T==='V' ? (r*N+c+1) : ((r+1)*N+c);
        walls.push(edgeKey(a,b));
      });
    }
  }
  if(!N) throw new Error('missing size');
  if(!Object.keys(numbers).length) throw new Error('missing checkpoints');
  return withWallSet({ N, numbers, walls, seed:null, gotd:true });
}

function utcDateString(){
  const now = new Date();
  const y = now.getUTCFullYear();
  const m = String(now.getUTCMonth()+1).padStart(2,'0');
  const d = String(now.getUTCDate()).padStart(2,'0');
  return ''+y+m+d;
}

// Returns a parsed puzzle, or null if today's file doesn't exist / is invalid.
async function fetchGameOfDay(){
  const dateStr = utcDateString();
  try{
    const res = await fetch('GameOfDay/'+dateStr+'.txt', {cache:'no-store'});
    if(!res.ok) return null;
    const text = await res.text();
    const puzzle = parseGameOfDay(text);
    puzzle.gotdDate = dateStr;
    return puzzle;
  }catch(e){
    console.warn('fetchGameOfDay failed:', e);
    return null;
  }
}

// ---------- Stats: Welford online mean/variance ----------
function newStat(){ return {n:0, mean:0, M2:0, recent:[]}; }
function updateStat(st, x){
  st.n += 1;
  const delta = x - st.mean;
  st.mean += delta/st.n;
  const delta2 = x - st.mean;
  st.M2 += delta*delta2;
  st.recent.push(x);
  if(st.recent.length>20) st.recent.shift();
  return st;
}
function statSummary(st){
  if(st.n===0) return {n:0, mean:0, sd:0};
  const variance = st.n>1 ? st.M2/(st.n-1) : 0;
  return {n:st.n, mean:st.mean, sd:Math.sqrt(variance)};
}

// ---------- Storage adapter ----------
// Two backends implementing the same async interface:
//   get(key, shared) -> {value: string} | null
//   set(key, value, shared) -> void
// Selection is by capability probe at boot, with localStorage as fallback.
// Rationale: `window.storage` is a custom API injected only inside Claude
// artifacts (and only after the artifact is published); `localStorage` is the
// standard browser API but is blocked inside the Claude sandbox. Neither is
// universal, and either can silently misbehave (Claude storage can hang if the
// host channel is dead or the (key, shared) signature is wrong; localStorage
// can throw SecurityError in a sandboxed iframe with cookies blocked). So we
// probe both with a real write/read round-trip guarded by a timeout, and fall
// back to an in-memory backend if neither works. This keeps the game running
// (degraded: no persistence) instead of freezing at "0% — searching…".

function makeClaudeStorage(){
  return {
    name: 'claude',
    shared: true,               // supports cross-client shared keys
    get: (key, shared) => window.storage.get(key, !!shared),
    set: (key, val, shared) => window.storage.set(key, val, !!shared),
  };
}

function makeLocalStorageBackend(){
  return {
    name: 'localStorage',
    shared: false,              // no cross-client sharing
    async get(key){
      try{
        const v = localStorage.getItem(key);
        return v == null ? null : { value: v };
      }catch(e){ return null; } // SecurityError / disabled storage
    },
    async set(key, val){
      try{ localStorage.setItem(key, val); }catch(e){}
    },
  };
}

// A no-op backend so the game always runs even if neither exists.
function makeMemoryBackend(){
  const mem = new Map();
  return {
    name: 'memory',
    shared: false,
    async get(key){ return mem.has(key) ? { value: mem.get(key) } : null; },
    async set(key, val){ mem.set(key, val); },
  };
}

async function pickStorage(){
  // 1. Prefer Claude's shared storage if it's really usable.
  if (window.storage && typeof window.storage.get === 'function'
                       && typeof window.storage.set === 'function'){
    const ok = await probe(makeClaudeStorage());
    if (ok) return makeClaudeStorage();
  }
  // 2. Fall back to localStorage if it works.
  if (typeof localStorage !== 'undefined'){
    const ok = await probe(makeLocalStorageBackend());
    if (ok) return makeLocalStorageBackend();
  }
  // 3. Last resort: in-memory (no persistence, but never hangs).
  return makeMemoryBackend();
}

// Probe = do a real write/read round-trip with a timeout.
// A backend that "exists" but never settles is treated as unusable.
async function probe(backend, timeoutMs){
  timeoutMs = timeoutMs || 1500;
  const key = '__probe__' + Math.random();
  const timeout = new Promise(r => setTimeout(() => r('timeout'), timeoutMs));
  try{
    const result = await Promise.race([
      (async () => {
        await backend.set(key, 'ok', false);
        const got = await backend.get(key, false);
        return got && got.value === 'ok' ? 'ok' : 'bad';
      })(),
      timeout,
    ]);
    return result === 'ok';
  }catch(e){
    return false;
  }
}

// The single object the rest of the app uses. Hydrated at boot.
let storage = null;

// Convenience wrappers so call sites stay readable and never touch
// window.storage / localStorage directly.
async function sGet(key, shared){ return storage ? storage.get(key, shared) : null; }
async function sSet(key, val, shared){ return storage ? storage.set(key, val, shared) : undefined; }
// True only if the active backend supports cross-client shared keys.
function storageIsShared(){ return !!(storage && storage.shared); }

// ---------- App state ----------
let state = {
  screen: 'menu', // menu | generating | local | online-lobby | online-play
  size: 5,
  puzzle: null,
  path: [],       // player's drawn path (array of cell idx)
  startTime: null,
  elapsed: 0,
  timerId: null,
  finished: false,
  room: null,
  playerId: null,
  playerName: '',
  pollId: null,
  roomData: null,
  genProgress: { frac: 0, walls: null, K: null, nextScreen: 'local' },
  isGotd: false,
  gotdPuzzleDate: null,
  gotdHint: null,
  hintsUsed: 0,
  hintCell: null,      // cell idx circled as the correct move, or null
  hintWrongCell: null, // cell idx marked red as the first wrong move, or null
  showDev: false,      // true while the hidden "v" key is held down
};

function cellRC(i,N){ return [Math.floor(i/N), i%N]; }
function startCellOf(puzzle){
  return Object.keys(puzzle.numbers).map(Number).find(i=>puzzle.numbers[i]===1);
}

// ---------- Hints ----------
// Cap = grid size N, unless there are fewer checkpoints than that, in which
// case cap = #checkpoints. puzzle.path is the unique solution (generation
// guarantees count===1), so it's a reliable answer key — no re-solving.
function maxHints(puzzle){
  const numCheckpoints = Object.keys(puzzle.numbers).length;
  return Math.min(puzzle.N, numCheckpoints);
}

// Returns { correctCell, wrongCell } where:
//   - on track: correctCell = the next move to make, wrongCell = null
//   - diverged: correctCell = what should have been played at the first
//     wrong step, wrongCell = the player's actual (wrong) cell at that step
//   - already solved / path >= solution length with no divergence: both null
function computeHint(puzzle, path){
  const solution = puzzle.path;
  // First divergence between the player's path and the solution: compares
  // position-by-position since solution[i] is the only legal cell at step i
  // (uniqueness of the generated puzzle guarantees this). If the player's
  // path matches the solution exactly so far, this loop simply doesn't find
  // a mismatch and i ends at path.length — "on track" case.
  let i = 0;
  while(i < path.length && i < solution.length && path[i] === solution[i]) i++;
  if(i < path.length){
    // Player deviated at step i: solution[i] is what it should have been;
    // path[i] is the wrong cell actually played there.
    return { correctCell: solution[i], wrongCell: path[i] };
  }
  // On track (path is a correct prefix of solution): hint the next move.
  if(i < solution.length) return { correctCell: solution[i], wrongCell: null };
  return { correctCell: null, wrongCell: null }; // path already equals the full solution
}
function gridAdjacent(a,b,N){
  const [r1,c1]=cellRC(a,N), [r2,c2]=cellRC(b,N);
  return Math.abs(r1-r2)+Math.abs(c1-c2)===1;
}
// Adjacent AND not separated by a wall for the current puzzle.
function adjacent(a,b,N){
  if(!gridAdjacent(a,b,N)) return false;
  const walls = state.puzzle && state.puzzle.wallSet;
  if(walls && walls.has(edgeKey(a,b))) return false;
  return true;
}

// ---------- Hidden "v" reveal ----------
// Version badge lives in the DOM on every screen (render() appends it), and
// the hint button is always rendered but hidden via inline style. Both are
// toggled directly here rather than through a full render(), so holding "v"
// never interrupts an in-progress drag (a re-render would replace the SVG
// and drop pointer capture mid-stroke).
function setDevReveal(on){
  on = !!on;
  if(state.showDev === on) return;
  state.showDev = on;
  const badge = document.getElementById('versionBadge');
  if(badge) badge.style.display = on ? 'block' : 'none';
  const hintBtn = document.getElementById('hintBtn');
  if(hintBtn) hintBtn.style.display = on ? '' : 'none';
}

function isTypingTarget(t){
  if(!t || !t.tagName) return false;
  const tag = t.tagName.toLowerCase();
  return tag==='input' || tag==='textarea' || tag==='select' || t.isContentEditable;
}

function installDevRevealKey(){
  window.addEventListener('keydown', e=>{
    if(e.key !== 'v' && e.key !== 'V') return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(isTypingTarget(e.target)) return; // don't hijack typing in room/name fields
    setDevReveal(true);
  });
  window.addEventListener('keyup', e=>{
    if(e.key !== 'v' && e.key !== 'V') return;
    setDevReveal(false);
  });
  // If focus leaves (alt-tab, devtools, tab switch) while "v" is held, the
  // keyup never arrives — hide on blur/visibility change so the reveal can't
  // get stuck on.
  window.addEventListener('blur', ()=>setDevReveal(false));
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) setDevReveal(false); });
}

// ---------- Rendering ----------
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='menu') html = renderMenu();
  else if(state.screen==='generating') html = renderGenerating();
  else if(state.screen==='local') html = renderGame(false);
  else if(state.screen==='online-lobby') html = renderLobby();
  else if(state.screen==='online-play') html = renderGame(true);
  app.innerHTML = html + renderVersionBadge();
  attachHandlers();
}

}
