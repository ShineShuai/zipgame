    ? `<button class="btn secondary" disabled title="One Game of Day per day">Game of Day</button>`
    : `<button class="btn secondary" id="playGotd">Game of Day</button>`;
  return `
  <div class="card">
    <h3 style="margin:0 0 4px;font-size:18px;font-weight:500">Zip</h3>
    <p class="small" style="margin:0 0 16px">Connect the numbers in order through every cell. No revisits, no crossings. Drag with mouse or finger to draw.</p>
    <div class="row" style="margin-bottom:12px">
      <label class="small">Grid size</label>
      <select id="sizeSel">
        <option value="5" selected>5x5</option>
        <option value="7">7x7</option>
        <option value="9">9x9</option>
        <option value="11">11x11</option>
        <option value="16">16x16</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="playLocal">Play local</button>
      ${gotdBtn}
      ${onlineBtn}
    </div>
    ${gotdPlayed? `<p class="small" style="margin:10px 0 0">${gotdAttemptCache.solved? `Today's Game of Day: solved in ${gotdAttemptCache.time.toFixed(1)}s.` : `Today's Game of Day already attempted.`}</p>` : ''}
    ${state.gotdHint? `<p class="small" style="margin:10px 0 0;color:#a33">${state.gotdHint}</p>` : ''}
    <p class="small" style="margin:12px 0 0">Storage: ${storage? storage.name : 'initializing…'}${storageIsShared()? '' : ' (local only)'}</p>
  </div>
  ${renderLocalStats()}
  `;
}

// Menu: one row per grid size that has at least one solve recorded.
function gotdCellText(N){
  const g = gotdBestCache[N];
  return g ? g.time.toFixed(1)+'s' : '-';
}

function renderLocalStats(){
  const rows = GRID_SIZES.map(N=>{
    const st = loadLocalStats(N);
    const sum = statSummary(st);
    const g = gotdBestCache[N];
    if(sum.n===0 && !g) return null;
    const best = st.recent.length ? Math.min(...st.recent) : 0;
    return `<tr>
      <td>${N}x${N}</td>
      <td><b>${sum.n||0}</b></td>
      <td><b>${sum.n? sum.mean.toFixed(1)+'s':'-'}</b></td>
      <td><b>${sum.n? sum.sd.toFixed(1)+'s':'-'}</b></td>
      <td><b>${sum.n? best.toFixed(1)+'s':'-'}</b></td>
      <td><b>${gotdCellText(N)}</b></td>
    </tr>`;
  }).filter(Boolean);
  if(rows.length===0) return '';
  return `<div class="card">
    <div class="hud"><span>Your stats</span><span></span></div>
    <table>
      <tr><th>Grid</th><th>Solves</th><th>Avg</th><th>Std dev</th><th>Best (last 20)</th><th>Game of Day</th></tr>
      ${rows.join('')}
    </table></div>`;
}

// In-game: compact single-size stats for whichever puzzle is being played.
function renderCurrentSizeStats(N){
  const sum = statSummary(loadLocalStats(N));
  const g = gotdBestCache[N];
  if(sum.n===0 && !g) return '';
  const best = loadLocalStats(N).recent.length ? Math.min(...loadLocalStats(N).recent) : 0;
  return `<div class="card">
    <div class="hud"><span>Your stats — ${N}x${N}</span><span></span></div>
    <table>${sum.n?`<tr><td>Solves</td><td><b>${sum.n}</b></td></tr>
    <tr><td>Avg time</td><td><b>${sum.mean.toFixed(1)}s</b></td></tr>
    <tr><td>Std dev</td><td><b>${sum.sd.toFixed(1)}s</b></td></tr>
    <tr><td>Best (last 20)</td><td><b>${best.toFixed(1)}s</b></td></tr>`:''}
    <tr><td>Game of Day</td><td><b>${gotdCellText(N)}</b></td></tr>
    </table></div>`;
}

// Stats are kept separately per grid size N, since solve times aren't
// comparable across sizes. Cached in-memory per N; hydrated from storage
// at boot, written through on update.
const GRID_SIZES = [5,7,9,11,16];
let localStatsCache = {}; // N -> stat object
function statKey(N){ return 'zip_local_stats_'+N; }
function loadLocalStats(N){
  return localStatsCache[N] || newStat();
}
// Sync hydration into the in-memory cache (the underlying storage call is
// awaited because the adapter is async, but this function itself is async
// only to keep a single code path for both backends).
async function hydrateLocalStats(){
  await Promise.all(GRID_SIZES.map(async N=>{
    try{
      const res = await sGet(statKey(N));
      localStatsCache[N] = res ? JSON.parse(res.value) : newStat();
    }catch(e){
      localStatsCache[N] = newStat();
    }
  }));
  await Promise.all(GRID_SIZES.map(N=>loadGotdBest(N)));
}
async function saveLocalStats(N, st){
  localStatsCache[N] = st;
  try{ await sSet(statKey(N), JSON.stringify(st)); }catch(e){}
}

// Game-of-Day best time per grid size N: {date, time} — one slot per N,
// overwritten whenever a GOTD solve on that N beats (or has no) prior best.
// Not mixed into the regular per-N Welford stats (different puzzle source).
function gotdKey(N){ return 'zip_gotd_best_'+N; }
let gotdBestCache = {}; // N -> {date, time} | null
async function loadGotdBest(N){
  if(gotdBestCache[N] !== undefined) return gotdBestCache[N];
  try{
    const res = await sGet(gotdKey(N));
    gotdBestCache[N] = res ? JSON.parse(res.value) : null;
  }catch(e){ gotdBestCache[N] = null; }
  return gotdBestCache[N];
}
async function recordGotdResult(N, dateStr, time){
  const prev = await loadGotdBest(N);
  if(!prev || prev.date!==dateStr || prev.time>time){
    const next = { date: dateStr, time };
    gotdBestCache[N] = next;
    try{ await sSet(gotdKey(N), JSON.stringify(next)); }catch(e){}
  }
  await saveGotdAttempt(dateStr, { solved:true, time });
}

// Play-once gate: one Game-of-Day attempt per UTC date, independent of size.
// {date, N, solved, time|null} — set the moment the puzzle is opened (so
// abandoning mid-solve still counts as today's attempt), refined with the
// solve time if finished. Cached in-memory (hydrated at boot for today's
// date only) so the menu can render its locked/unlocked state synchronously.
function gotdAttemptKey(dateStr){ return 'zip_gotd_attempt_'+dateStr; }
let gotdAttemptCache = null; // {solved, time} | null — always for gotdAttemptCacheDate
let gotdAttemptCacheDate = null;
async function loadGotdAttempt(dateStr){
  try{
    const res = await sGet(gotdAttemptKey(dateStr));
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function saveGotdAttempt(dateStr, attempt){
  gotdAttemptCache = attempt;
  gotdAttemptCacheDate = dateStr;
  try{ await sSet(gotdAttemptKey(dateStr), JSON.stringify(attempt)); }catch(e){}
}
async function hydrateGotdAttempt(){
  const dateStr = utcDateString();
  gotdAttemptCache = await loadGotdAttempt(dateStr);
  gotdAttemptCacheDate = dateStr;
}
// Called from renderMenu: if the cache is for a stale (pre-rollover) UTC
// date, re-hydrate in the background and re-render once fresh, so a tab
// left open across midnight unlocks today's attempt without a reload.
function refreshGotdAttemptIfStale(){
  const today = utcDateString();
  if(gotdAttemptCacheDate === today) return;
  hydrateGotdAttempt().then(()=>{ if(state.screen==='menu') render(); });
}

// Per-N "which puzzle of today's sequence are we all on" pointer. This is
// SHARED storage (when the backend supports it): the puzzle at position k of
// the day is dailySeed(today, N, k), a pure function of (day, N, k) — so any
// two clients requesting position k always compute the identical puzzle. The
// counter itself is shared so that "New puzzle" advances the sequence for
// everyone, keeping every client's puzzle-count in lockstep, rather than
// each client silently drifting onto a different position (the earlier bug:
// the pointer was private per-client, so index N meant a different puzzle
// per person after the first "New puzzle" click).
//
// On a per-user backend (localStorage/memory) the "shared" flag is ignored,
// so the sequence advances only for this user. The puzzle at a given index
// is still deterministic and identical across users who happen to be at the
// same index; they just won't stay in lockstep.
function dailyIndexKey(N){ return 'zip_daily_index_'+N; }
async function readDailyIndex(N){
  const today = utcDayNumber();
  try{
    const res = await sGet(dailyIndexKey(N), true);
    const parsed = res ? JSON.parse(res.value) : null;
    if(parsed && parsed.day===today) return parsed.index;
  }catch(e){}
  return 0; // no entry yet, or stale day: sequence starts fresh at position 0
}
// Returns the seed for today's puzzle at the CURRENT shared position (does
// not advance it) — used when just opening/joining, not starting a new one.
async function currentDailySeed(N){
  const index = await readDailyIndex(N);
  return dailySeed(utcDayNumber(), N, index);
}
// Advances the shared position by one and returns the seed for that new
// position. On a shared backend every client calling this on the same day
// converges on the same sequence of positions; on a per-user backend only
// this client advances.
async function advanceDailySeed(N){
  const today = utcDayNumber();
  const index = await readDailyIndex(N);
  const nextIndex = index + 1;
  try{ await sSet(dailyIndexKey(N), JSON.stringify({day: today, index: nextIndex}), true); }catch(e){}
  return dailySeed(today, N, nextIndex);
}

function renderLobby(){
  return `
  <div class="card">
    <h3 style="margin:0 0 12px;font-size:16px;font-weight:500">Play online</h3>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="nameInput" placeholder="Your name" value="${state.playerName}" style="width:140px">
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="createRoom">Create room</button>
    </div>
    <div class="row">
      <input type="text" id="roomInput" placeholder="Room code" style="width:100px;text-transform:uppercase">
      <button class="btn secondary" id="joinRoom">Join</button>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn secondary" id="backMenu">Back</button>
    </div>
  </div>`;
}

function renderGame(online){
  const N = state.puzzle.N;
  const cellSize = 60; // fixed logical unit; on-screen size comes from viewBox scaling, not this
  const svgSize = cellSize*N;
  let svg = `<svg viewBox="0 0 ${svgSize} ${svgSize}" class="zip-svg" style="touch-action:none;cursor:pointer;background:#fafafa;border-radius:8px;width:100%;height:auto;max-width:${Math.min(480,svgSize)}px;display:block;margin:0 auto">`;
  // grid lines
  for(let i=0;i<=N;i++){
    svg += `<line x1="0" y1="${i*cellSize}" x2="${svgSize}" y2="${i*cellSize}" stroke="#ddd"/>`;
    svg += `<line x1="${i*cellSize}" y1="0" x2="${i*cellSize}" y2="${svgSize}" stroke="#ddd"/>`;
  }
  // walls: thick bars drawn on the shared border of the two cells they block
  (state.puzzle.walls||[]).forEach(key=>{
    const [a,b] = key.split('_').map(Number);
    const [r1,c1] = cellRC(a,N), [r2,c2] = cellRC(b,N);
    if(r1===r2){ // vertical wall between horizontally adjacent cells
      const cc = Math.max(c1,c2);
      const x = cc*cellSize, y0 = r1*cellSize, y1 = y0+cellSize;
      svg += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`;
    } else { // horizontal wall between vertically adjacent cells
      const rr = Math.max(r1,r2);
      const y = rr*cellSize, x0 = c1*cellSize, x1 = x0+cellSize;
      svg += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`;
    }
  });
  // drawn path
  // Path element (always present so redrawLive can find it)
  let d = '';
  if(state.path.length>1){
    state.path.forEach((idx,i)=>{
      const [r,c] = cellRC(idx,N);
      const x = c*cellSize+cellSize/2, y = r*cellSize+cellSize/2;
      d += (i===0?'M':'L')+x+' '+y+' ';
    });
  }
  svg += `<path data-role="path" d="${d}" stroke="#1a1a1a" stroke-width="${cellSize*0.28}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;

  // Numbers + hit rects
  for(let i=0;i<N*N;i++){
    const [r,c] = cellRC(i,N);
    const x = c*cellSize+cellSize/2, y = r*cellSize+cellSize/2;
    if(state.puzzle.numbers[i]){
      const filled = state.path.includes(i);
      svg += `<g data-num-cell="${i}">`;
      svg += `<circle cx="${x}" cy="${y}" r="${cellSize*0.32}" fill="${filled?'#1a1a1a':'#fff'}" stroke="#1a1a1a" stroke-width="2"/>`;
      svg += `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="${cellSize*0.32}" fill="${filled?'#fff':'#1a1a1a'}" font-weight="600">${state.puzzle.numbers[i]}</text>`;
      svg += `</g>`;
    }
    svg += `<rect data-cell="${i}" x="${c*cellSize}" y="${r*cellSize}" width="${cellSize}" height="${cellSize}" fill="transparent"/>`;
  }
  // Hint markers: drawn last so they sit above the path/checkpoint circles
  // regardless of what's underneath.
  //  - wrongCell (if any): a filled red X/mark over the first wrong move
  //    already in the player's path.
  //  - correctCell: a pulsing ring over the move they should make/have made.
  if(state.hintWrongCell != null){
    const [wr,wc] = cellRC(state.hintWrongCell,N);
    const wx = wc*cellSize+cellSize/2, wy = wr*cellSize+cellSize/2;
    const s = cellSize*0.22;
    svg += `<g data-role="hint-wrong" stroke="#d1352b" stroke-width="5" stroke-linecap="round">`;
    svg += `<line x1="${wx-s}" y1="${wy-s}" x2="${wx+s}" y2="${wy+s}"/>`;
    svg += `<line x1="${wx-s}" y1="${wy+s}" x2="${wx+s}" y2="${wy-s}"/>`;
    svg += `</g>`;
  }
  if(state.hintCell != null){
    const [hr,hc] = cellRC(state.hintCell,N);
    const hx = hc*cellSize+cellSize/2, hy = hr*cellSize+cellSize/2;
    svg += `<circle data-role="hint" cx="${hx}" cy="${hy}" r="${cellSize*0.4}" fill="none" stroke="#e0a000" stroke-width="4" stroke-dasharray="6 4"><animate attributeName="r" values="${cellSize*0.36};${cellSize*0.44};${cellSize*0.36}" dur="1s" repeatCount="indefinite"/></circle>`;
  }
  svg += `</svg>`;

  const timeStr = state.elapsed.toFixed(1)+'s';
  let extra = (online ? renderLeaderboard() : '') + renderCurrentSizeStats(N);

  return `
  <div class="card">
    <div class="hud">
      <span>${online? 'Room '+state.room : (state.isGotd? 'Game of Day '+state.gotdPuzzleDate : 'Local')}</span>
      <span>Time: <b id="hudTime">${timeStr}</b></span>
    </div>
    <div class="grid-wrap" id="gridWrap">${svg}</div>
    <div class="row">
      <button class="btn secondary" id="backMenu2">Menu</button>
      ${state.isGotd? '' : '<button class="btn secondary" id="newPuzzle">New puzzle</button>'}
      <button class="btn secondary" id="resetPath">Reset path</button>
      <button class="btn secondary" id="hintBtn" style="${state.showDev?'':'display:none'}" ${state.finished || state.hintsUsed>=maxHints(state.puzzle) ? 'disabled' : ''}>Hint (${state.hintsUsed}/${maxHints(state.puzzle)})</button>
    </div>
    ${state.finished? `<p style="color:#1a6e2c;font-weight:500;margin-top:10px">Solved in ${timeStr}</p>` : ''}
  </div>
  ${extra}
  `;
}

function renderLeaderboard(){
  const room = state.roomData;
  if(!room) return '';
  const players = Object.entries(room.players||{});
  players.sort((a,b)=>{
    const at=a[1].finishedAt, bt=b[1].finishedAt;
    if(at&&bt) return at-bt;
    if(at) return -1;
    if(bt) return 1;
    return 0;
  });
  const total = state.puzzle.N*state.puzzle.N;
  const rows = players.map(([id,p])=>{
    const done = !!p.finishedAt;
    return `<tr>
      <td>${p.name}${id===state.playerId?' (you)':''}</td>
      <td>${done? '<span class="tag done">done '+p.time.toFixed(1)+'s</span>' : '<span class="tag">'+(p.progress||0)+'/'+total+'</span>'}</td>
      <td class="small">avg ${p.statMean? p.statMean.toFixed(1)+'s':'-'}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="hud"><span>Live ranking</span><span class="small">${players.length} players</span></div>
    <table>${rows}</table>
  </div>`;
}

// ---------- Handlers ----------
function attachHandlers(){
  const el = id => document.getElementById(id);
  if(el('playLocal')) el('playLocal').onclick = ()=>{
    state.size = parseInt(el('sizeSel').value);
    startLocal(false); // open today's current puzzle in the shared sequence
  };
  if(el('playGotd')) el('playGotd').onclick = startGameOfDay;
  if(el('goOnline')) el('goOnline').onclick = ()=>{
    if(!storageIsShared()){
      alert('Online mode requires shared storage (available inside Claude artifacts).');
      return;
    }
    state.screen='online-lobby'; render();
  };
  if(el('backMenu')) el('backMenu').onclick = ()=>{ state.screen='menu'; render(); };
  if(el('backMenu2')) el('backMenu2').onclick = ()=>{
    stopTimer(); stopPolling(); state.screen='menu'; render();
  };
  if(el('createRoom')) el('createRoom').onclick = createRoom;
  if(el('joinRoom')) el('joinRoom').onclick = joinRoom;
  if(el('resetPath')) el('resetPath').onclick = ()=>{ state.path=[]; state.finished=false; state.hintCell=null; state.hintWrongCell=null; render(); };
  if(el('hintBtn')) el('hintBtn').onclick = ()=>{
    if(state.finished) return;
    const cap = maxHints(state.puzzle);
    if(state.hintsUsed >= cap) return;
    const { correctCell, wrongCell } = computeHint(state.puzzle, state.path);
    if(correctCell == null) return; // nothing to hint (path already correct/complete)
    state.hintsUsed++;
    state.hintCell = correctCell;
    state.hintWrongCell = wrongCell;
    render();
  };
  if(el('newPuzzle')) el('newPuzzle').onclick = ()=>{
    if(state.screen==='online-play'){ return; } // puzzle is shared in online mode
    if(state.isGotd){ return; } // one Game-of-Day puzzle per day, nothing to advance to
    startLocal(true); // advance everyone to the next puzzle in today's sequence
  };

  const wrap = el('gridWrap');
  if(wrap) setupGridInput(wrap);
}

// ---------- Drag input (the fixed version) ----------
function setupGridInput(wrap){
  const svg = wrap.querySelector('svg');
  if(!svg) return;

  const N = state.puzzle.N;
  const cellSize = 60; // logical units (matches viewBox); screen px derived per-call below

  let dragging = false;
  let lastPoint = null;

  // Screen px -> logical-unit scale, cached and refreshed on resize (not
  // per-move) since getBoundingClientRect() forces layout and this is on the
  // pointermove hot path.
  let screenCellSize = cellSize;
  function refreshScale(){
    const rect = svg.getBoundingClientRect();
    if(rect.width > 0) screenCellSize = rect.width / N;
  }
  refreshScale();
  window.addEventListener('resize', refreshScale);

  function cellFromPoint(clientX, clientY){
    const rect = svg.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    if(x < 0 || y < 0 || x >= rect.width || y >= rect.height) return null;
    const c = Math.floor(x / screenCellSize);
    const r = Math.floor(y / screenCellSize);
    if(r < 0 || r >= N || c < 0 || c >= N) return null;
    return r*N + c;
  }

  // Path element's `d` attribute is maintained incrementally (append on
  // push, truncate on pop) instead of rebuilt from scratch each call, and
  // only the one or two cells whose fill state actually changed get a DOM
  // write, instead of scanning every numbered cell. Together this makes a
  // drag step O(1) DOM work instead of O(path length + numbered cells).
  let pathD = '';
  const pathSet = new Set(); // mirrors state.path contents for O(1) membership

  function pointFor(idx){
    const [r,c] = cellRC(idx, N);
    return { x: c*cellSize + cellSize/2, y: r*cellSize + cellSize/2 };
  }
  function setCellFill(idx, filled){
    const node = svg.querySelector(`[data-num-cell="${idx}"]`);
    if(!node) return;
    const circle = node.querySelector('circle');
    const text = node.querySelector('text');
    if(circle) circle.setAttribute('fill', filled ? '#1a1a1a' : '#fff');
    if(text) text.setAttribute('fill', filled ? '#fff' : '#1a1a1a');
  }
  function setPathD(){
    const pathEl = svg.querySelector('path[data-role="path"]');
    if(pathEl) pathEl.setAttribute('d', pathD);
  }
  // Called once after any full state.path replacement (reset, new puzzle,
  // jump-to-start) to resync the incremental caches with reality.
  function resyncPathCache(){
    pathSet.clear();
    pathD = '';
    state.path.forEach((idx,i)=>{
      pathSet.add(idx);
      const p = pointFor(idx);
      pathD += (i===0?'M':'L') + p.x + ' ' + p.y + ' ';
    });
  }
  resyncPathCache();

  function clearHintMarker(){
    if(state.hintCell == null && state.hintWrongCell == null) return;
    state.hintCell = null;
    state.hintWrongCell = null;
    const node = svg.querySelector('[data-role="hint"]');
    if(node) node.remove();
    const wrongNode = svg.querySelector('[data-role="hint-wrong"]');
    if(wrongNode) wrongNode.remove();
  }

  function pushCell(idx){
    state.path.push(idx);
    pathSet.add(idx);
    const p = pointFor(idx);
    pathD += (pathD===''?'M':'L') + p.x + ' ' + p.y + ' ';
    setPathD();
    setCellFill(idx, true);
    clearHintMarker();
  }
  function popCell(){
    const idx = state.path.pop();
    pathSet.delete(idx);
    resyncPathCache(); // truncating `d` losslessly needs the rebuilt string; pops are rare (backtrack) so O(n) here is fine
    setPathD();
    setCellFill(idx, false);
    clearHintMarker();
  }
  function resetCell(idx){
    state.path = [idx];
    resyncPathCache();
    setPathD();
    clearHintMarker();
  }

  function walkTo(newCell){
    if(newCell == null) return;
    if(state.finished) return;

    const len = state.path.length;

    // Backtrack one step
    if(len > 1 && newCell === state.path[len-2]){
      popCell();
      return;
    }

    if(pathSet.has(newCell)) return;

    if(len === 0){
      const startCell = startCellOf(state.puzzle);
      if(newCell !== startCell) return; // must begin at checkpoint 1
      pushCell(newCell);
      return;
    }

    const last = state.path[len-1];
    if(newCell === last) return;
    if(!adjacent(last, newCell, N)){
      // Not reachable from current path end: treat as "start over" from this
      // cell instead of silently ignoring the tap (avoids feeling stuck).
      if(newCell === startCellOf(state.puzzle)){
        resetCell(newCell);
      }
      return;
    }

    pushCell(newCell);
    checkSolvedDuringDrag();
    updateOnlineProgress();
  }

  function checkSolvedDuringDrag(){
    const total = N*N;
    if(state.path.length !== total) return;
    const nums = state.puzzle.numbers;
    const numCells = Object.keys(nums).map(Number);
    const startCell = startCellOf(state.puzzle);
    const maxNum = Math.max(...numCells.map(i=>nums[i]));
    const endCell = numCells.find(i=>nums[i]===maxNum);

    // The path must begin at checkpoint 1 and finish on the highest
    // checkpoint — this matches the rule the generator's uniqueness search
    // (countSolutions) enforces, otherwise a path that hits the last number
    // early and then wanders through the remaining empty cells would be
    // accepted even though it isn't the intended solution.
    if(state.path[0] !== startCell) return;
    if(state.path[state.path.length-1] !== endCell) return;

    const seen = [];
    state.path.forEach(i=>{ if(nums[i]) seen.push(nums[i]); });
    let ok = seen.length === Object.keys(nums).length;
    for(let i=1; i<seen.length && ok; i++){
      if(seen[i] < seen[i-1]) ok = false;
    }
    if(ok){
      state.finished = true;
      stopTimer();
      if(state.isGotd){
        recordGotdResult(N, state.gotdPuzzleDate, state.elapsed);
      } else {
        const st = loadLocalStats(N);
        updateStat(st, state.elapsed);
        saveLocalStats(N, st);
      }
      if(state.screen === 'online-play') finishOnline();
    }
  }

  function handleMove(clientX, clientY){
    if(lastPoint){
      const dx = clientX - lastPoint.x;
      const dy = clientY - lastPoint.y;
      const dist = Math.hypot(dx, dy);
      const step = Math.max(2, screenCellSize / 2);
      const steps = Math.max(1, Math.ceil(dist / step));
      for(let i=1; i<=steps; i++){
        const px = lastPoint.x + dx * (i/steps);
        const py = lastPoint.y + dy * (i/steps);
        const cell = cellFromPoint(px, py);
        if(cell != null) walkTo(cell);
      }
    } else {
      const cell = cellFromPoint(clientX, clientY);
      if(cell != null) walkTo(cell);
    }
    lastPoint = {x: clientX, y: clientY};
  }

  function onDown(e){
    e.preventDefault();
    dragging = true;
    lastPoint = null;
    try { svg.setPointerCapture(e.pointerId); } catch(_) {}
    handleMove(e.clientX, e.clientY);
  }

  function onMove(e){
    if(!dragging) return;
    e.preventDefault();
    handleMove(e.clientX, e.clientY);
  }

  function onUp(e){
    if(!dragging) return;
    dragging = false;
    lastPoint = null;
    try { svg.releasePointerCapture(e.pointerId); } catch(_) {}
    // Full render now that drag is over
    render();
  }

  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);
}

// ---------- Solve check (used outside drag) ----------
function checkSolved(){
  const N = state.puzzle.N;
  const total = N*N;
  if(state.path.length!==total) { updateOnlineProgress(); return; }
  const nums = state.puzzle.numbers;
  const numCells = Object.keys(nums).map(Number);
  const startCell = startCellOf(state.puzzle);
  const maxNum = Math.max(...numCells.map(i=>nums[i]));
  const endCell = numCells.find(i=>nums[i]===maxNum);

  // Same start/end rule as checkSolvedDuringDrag (and the generator's
  // uniqueness search): begin at checkpoint 1, finish on the highest one.
  if(state.path[0]!==startCell || state.path[state.path.length-1]!==endCell){
    updateOnlineProgress();
    return;
  }

  const seen = [];
  state.path.forEach(idx=>{ if(nums[idx]) seen.push(nums[idx]); });
  let ok = seen.length===Object.keys(nums).length;
  for(let i=1;i<seen.length && ok;i++){ if(seen[i]<seen[i-1]) ok=false; }
  if(ok){
    state.finished = true;
    stopTimer();
    if(state.isGotd){
      recordGotdResult(N, state.gotdPuzzleDate, state.elapsed);
    } else {
      const st = loadLocalStats(N);
      updateStat(st, state.elapsed);
      saveLocalStats(N, st);
    }
    if(state.screen==='online-play') finishOnline();
  } else {
    updateOnlineProgress();
  }
}

// ---------- Local game ----------
// advance=false: open today's puzzle at the current shared sequence position.
// advance=true ("New puzzle"): move the shared position forward one and play that.
async function startLocal(advance){
  state.screen = 'generating';
  state.genProgress = { frac: 0, walls: null, K: null, nextScreen: 'local' };
  render();
  try{
    const seed = advance ? await advanceDailySeed(state.size) : await currentDailySeed(state.size);
    const puzzle = await genPuzzleAsync(state.size, seed, null, (frac, walls, K)=>{
      // frac===null means a mid-attempt update (still working on the current
      // attempt) — keep showing the last known overall fraction so the bar
      // doesn't visibly snap back to 0% and jump forward again each tick.
      const prevFrac = state.genProgress.frac;
      state.genProgress = { frac: frac==null ? prevFrac : frac, walls, K, nextScreen: 'local' };
      if(state.screen==='generating') render();
    });
    state.puzzle = puzzle;
    state.isGotd = false;
    state.gotdPuzzleDate = null;
    state.path = [];
    state.finished = false;
    state.elapsed = 0;
    state.hintsUsed = 0;
    state.hintCell = null;
    state.hintWrongCell = null;
    state.screen = 'local';
    startTimer();
    render();
  }catch(e){
    // Never leave the user stranded on the generating screen: surface the
    // error and return to the menu so they can try again.
    console.error('startLocal failed:', e);
    state.screen = 'menu';
    render();
    alert('Could not generate a puzzle. Please try again.');
  }
}

async function startGameOfDay(){
  const dateStr = utcDateString();
  if(gotdAttemptCacheDate !== dateStr){
    await hydrateGotdAttempt();
  }
  if(gotdAttemptCache){
    state.gotdHint = gotdAttemptCache.solved
      ? `Already played today's Game of Day — solved in ${gotdAttemptCache.time.toFixed(1)}s.`
      : `Already played today's Game of Day.`;
    render();
    return;
  }
  const puzzle = await fetchGameOfDay();
  if(!puzzle){
    state.gotdHint = 'No game of day today.';
    render();
    return;
  }
  state.gotdHint = null;
  state.size = puzzle.N;
  state.puzzle = puzzle;
  state.isGotd = true;
  state.gotdPuzzleDate = puzzle.gotdDate;
  state.path = [];
  state.finished = false;
  state.elapsed = 0;
  state.hintsUsed = 0;
  state.hintCell = null;
  state.hintWrongCell = null;
  state.screen = 'local';
  // Lock the attempt in immediately (before it's solved) so abandoning
  // mid-puzzle — reload, back to menu — still consumes today's one try.
  await saveGotdAttempt(dateStr, { solved:false, time:null });
  startTimer();
  render();
}

function startTimer(){
  stopTimer();
  state.startTime = performance.now() - state.elapsed*1000;
  state.timerId = setInterval(()=>{
    state.elapsed = (performance.now()-state.startTime)/1000;
    const el = document.getElementById('hudTime');
    if(el) el.textContent = state.elapsed.toFixed(1)+'s';
  }, 100);
}
function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }

// ---------- Online (shared artifact storage) ----------
// NOTE: online mode only works when the active storage backend supports
// shared keys (i.e. the Claude backend). On localStorage/memory the UI hides
// the online entry points, and these functions guard defensively.
function roomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

async function createRoom(){
  if(!storageIsShared()){ alert('Online mode requires shared storage.'); return; }
  const nameInput = document.getElementById('nameInput');
  state.playerName = (nameInput.value||'Player').trim().slice(0,20);
  const code = roomCode();
  state.screen = 'generating';
  state.genProgress = { frac: 0, walls: null, K: null, nextScreen: 'online-lobby' };
  render();
  try{
    const seed = await currentDailySeed(state.size);
    const puzzle = await genPuzzleAsync(state.size, seed, null, (frac, walls, K)=>{
      const prevFrac = state.genProgress.frac;
      state.genProgress = { frac: frac==null ? prevFrac : frac, walls, K, nextScreen: 'online-lobby' };
      if(state.screen==='generating') render();
    });
    const roomData = { code, puzzle, players:{}, createdAt: Date.now() };
    await sSet('room:'+code, JSON.stringify(roomData), true);
    await joinRoomByCode(code);
  }catch(e){
    console.error('createRoom failed:', e);
    state.screen = 'online-lobby';
    render();
    alert('Could not create room. Try again.');
  }
}

async function joinRoom(){
  if(!storageIsShared()){ alert('Online mode requires shared storage.'); return; }
  const nameInput = document.getElementById('nameInput');
  const roomInput = document.getElementById('roomInput');
  state.playerName = (nameInput.value||'Player').trim().slice(0,20);
  const code = (roomInput.value||'').trim().toUpperCase();
  if(!code) return;
  await joinRoomByCode(code);
}

async function joinRoomByCode(code){
  try{
    const res = await sGet('room:'+code, true);
    if(!res){ alert('Room not found'); return; }
    const roomData = JSON.parse(res.value);
    state.room = code;
    state.puzzle = withWallSet(roomData.puzzle);
    state.playerId = 'p_'+Math.random().toString(36).slice(2,9);
    state.isGotd = false;
    state.gotdPuzzleDate = null;
    const st = loadLocalStats(roomData.puzzle.N);
    const sum = statSummary(st);
    roomData.players[state.playerId] = { name: state.playerName, progress:0, finishedAt:null, time:0, statMean: sum.n?sum.mean:null };
    await sSet('room:'+code, JSON.stringify(roomData), true);
    state.roomData = roomData;
    state.path = [];
    state.finished = false;
    state.elapsed = 0;
    state.hintsUsed = 0;
    state.hintCell = null;
    state.hintWrongCell = null;
    state.screen = 'online-play';
    startTimer();
    startPolling();
    render();
  }catch(e){
    console.error('joinRoomByCode failed:', e);
    alert('Could not join room.');
  }
}

let progressThrottle = 0;
async function updateOnlineProgress(){
  if(state.screen!=='online-play') return;
  if(!storageIsShared()) return;
  const now = Date.now();
  if(now-progressThrottle<800) return;
  progressThrottle = now;
  try{
    const res = await sGet('room:'+state.room, true);
    if(!res) return;
    const roomData = JSON.parse(res.value);
    if(roomData.players[state.playerId]){
      roomData.players[state.playerId].progress = state.path.length;
      await sSet('room:'+state.room, JSON.stringify(roomData), true);
    }
  }catch(e){}
}

async function finishOnline(){
  if(!storageIsShared()) return;
  try{
    const res = await sGet('room:'+state.room, true);
    if(!res) return;
    const roomData = JSON.parse(res.value);
    const p = roomData.players[state.playerId];
    if(p && !p.finishedAt){
      p.finishedAt = Date.now();
      p.time = state.elapsed;
      p.progress = state.path.length;
    }
    await sSet('room:'+state.room, JSON.stringify(roomData), true);
    state.roomData = roomData;
  }catch(e){}
}

function startPolling(){
  stopPolling();
  if(!storageIsShared()) return;
  state.pollId = setInterval(async ()=>{
    if(state.screen!=='online-play') return;
    try{
      const res = await sGet('room:'+state.room, true);
      if(res){
        state.roomData = JSON.parse(res.value);
        // Only full-render if not currently dragging
        const wrap = document.getElementById('gridWrap');
        if(wrap && wrap.querySelector('svg')){
          // refresh just the leaderboard + hud to avoid killing a drag
          const cards = document.querySelectorAll('#app .card');
          const last = cards[cards.length-1];
          if(last && last.querySelector('table')){
            const players = Object.entries(state.roomData.players||{});
            players.sort((a,b)=>{
              const at=a[1].finishedAt, bt=b[1].finishedAt;
              if(at&&bt) return at-bt;
              if(at) return -1;
              if(bt) return 1;
              return 0;
            });
            const total = state.puzzle.N*state.puzzle.N;
            last.querySelector('table').innerHTML = players.map(([id,p])=>{
              const done = !!p.finishedAt;
              return `<tr>
                <td>${p.name}${id===state.playerId?' (you)':''}</td>
                <td>${done? '<span class="tag done">done '+p.time.toFixed(1)+'s</span>' : '<span class="tag">'+(p.progress||0)+'/'+total+'</span>'}</td>
                <td class="small">avg ${p.statMean? p.statMean.toFixed(1)+'s':'-'}</td>
              </tr>`;
            }).join('');
          }
        }
      }
    }catch(e){}
  }, 1500);
}
function stopPolling(){ if(state.pollId){ clearInterval(state.pollId); state.pollId=null; } }

// ---------- Boot ----------
// Pick a storage backend first (this can involve a probe with a timeout, so
// it must complete before we try to hydrate stats or render). The whole boot
// is wrapped so that a catastrophic failure still renders the menu instead of
// leaving a blank page.
(async function boot(){
  try{
    storage = await pickStorage();
    console.log('storage backend:', storage.name, storageIsShared() ? '(shared)' : '(local only)');
  }catch(e){
    console.warn('storage selection failed, using memory backend:', e);
    storage = makeMemoryBackend();
  }
  try{
    await hydrateLocalStats();
    await hydrateGotdAttempt();
  }catch(e){
    console.warn('stats hydration failed:', e);
  }
  installDevRevealKey();
  render();
})();

})();
</script>
