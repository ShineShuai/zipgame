# Production site: the play app at https://play.vintoshine.com/zigzag/
# (workflow .github/workflows/prod.yml). Static files only: no script, no bindings.
# No domain, no workers.dev URL: the portal Worker `play-portal` (repo play) owns
# play.vintoshine.com and reaches this Worker through a service binding.
# `dist/` is built by the workflow: the staged site in dist/zigzag/, plus _headers.
name = "zigzag-site"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../../dist"
