    <rect x="18.7" y="6.7" width="10.6" height="10.6" rx="2" fill="#fff" stroke="#a9bcf5"
      stroke-width="0.7"/>
    <rect x="30.7" y="6.7" width="10.6" height="10.6" rx="2" fill="#fff" stroke="#a9bcf5"
      stroke-width="0.7"/>
    <rect x="6.7" y="18.7" width="10.6" height="10.6" rx="2" fill="#fff" stroke="#a9bcf5"
      stroke-width="0.7"/>
    <rect x="18.7" y="18.7" width="10.6" height="10.6" rx="2" fill="#fff" stroke="#a9bcf5"
