<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img">
  <title>Zip (tile Z)</title>
  <desc>A 3x3 board whose orange tiles spell the letter Z; checkpoints 1 and 2 on its corners.</desc>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#dde6ff"/>
  <g>
    <rect x="6.9" y="6.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="18.9" y="6.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="30.9" y="6.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="6.9" y="18.9" width="10.2" height="10.2" rx="2.4" fill="#fff" stroke="#a9bcf5"
      stroke-width="0.7"/>
    <rect x="18.9" y="18.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="30.9" y="18.9" width="10.2" height="10.2" rx="2.4" fill="#fff" stroke="#a9bcf5"
      stroke-width="0.7"/>
    <rect x="6.9" y="30.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="18.9" y="30.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
    <rect x="30.9" y="30.9" width="10.2" height="10.2" rx="2.4" fill="#ffb020"/>
  </g>
  <circle cx="12" cy="12" r="5.4" fill="#3b68ee" stroke="#fff" stroke-width="0.8"/>
  <path transform="translate(12 12)" d="M-1.5-1.3 0.8-2.9V2.9" fill="none" stroke="#fff"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="36" r="5.4" fill="#3b68ee" stroke="#fff" stroke-width="0.8"/>
  <path transform="translate(36 36)"
    d="M-2.1-1.3C-1.9-3.3 2.1-3.5 2.1-1.4C2.1 0.2-0.3 1.3-2.2 2.9H2.3" fill="none" stroke="#fff"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
