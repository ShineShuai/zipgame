name: Production deploy

# Deploys the play app to https://play.vintoshine.com/zigzag/ (Cloudflare Workers static assets).
#  - Scheduled, every day: promotes the newest commit of main that has been there for
#    SOAK_DAYS, and only with DRY_RUN=false (otherwise it checks and stages, nothing
#    more). The rules are in .github/scripts/select-release.sh.
#  - Manual: Actions -> Production deploy -> Run workflow (any commit of main or of a
#    hotfix/* branch, no waiting, e.g. a hotfix or a rollback).
# The code comes from the chosen commit; the deploy config and the scripts come from the commit
# this workflow runs on, so an old commit (rollback) deploys the same way. The test gate is the
# chosen commit's own (npm run release:gate), so a rename of its scripts never breaks a deploy.
# See deploy/README.md.
# The Game of Day puzzles are not part of the soaked commit: they are released on their own
# (gotd.yml), and every deploy here carries the puzzles of main as they are now.

run-name: >-
  ${{ github.event_name == 'schedule' && 'prod scheduled promote'
  || format('prod {0} - {1}', inputs.ref, inputs.reason) }}

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (must be on main or on a hotfix/* branch)
        required: true
        default: main
      reason:
        description: Why (shown in the run summary)
        required: true
      dry_run:
        description: Run the checks and stage the site, deploy nothing
        type: boolean
        default: false
      smoke:
        description: Smoke test after the deploy (off only for the very first deploy)
        type: boolean
        default: true

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4   # pin the exact version printed in a deploy log, e.g. wrangler@4.x.y

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.sel.outputs.run }}
      sha: ${{ steps.sel.outputs.sha }}
      live: ${{ steps.sel.outputs.live }}
      dry: ${{ steps.sel.outputs.dry }}
      smoke: ${{ steps.sel.outputs.smoke }}
      reason: ${{ steps.sel.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select what to deploy
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          REASON: ${{ inputs.reason }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SMOKE_INPUT: ${{ inputs.smoke }}
          PROD_FREEZE: ${{ vars.PROD_FREEZE }}
          SOAK_DAYS: ${{ vars.SOAK_DAYS }}
          DRY_RUN_VAR: ${{ vars.DRY_RUN }}
        run: bash .github/scripts/select-release.sh

  deploy:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # creates the tags; only that step gets the token
    environment:
      name: production
      url: https://play.vintoshine.com/zigzag/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ needs.select.outputs.sha }}
      LIVE: ${{ needs.select.outputs.live }}
      GOTD_AHEAD: ${{ vars.GOTD_AHEAD }}   # the puzzle window of stage-prod.sh (unset = all puzzles)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the commit to deploy
        run: |
          set -euo pipefail
          # deploy config and scripts: from the commit of this run, not from the one deployed
          mkdir -p "$RUNNER_TEMP/ctl"
          cp -a deploy/cloudflare .github/scripts/smoke-site.sh .github/scripts/assert-private.sh \
            .github/scripts/stage-prod.sh .github/scripts/check-puzzles.mjs "$RUNNER_TEMP/ctl/"
          git checkout --quiet --detach "$SHA"
          rm -rf deploy/cloudflare
          mkdir -p deploy
          cp -a "$RUNNER_TEMP/ctl/cloudflare" deploy/cloudflare

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every tier, not only the fast one: the slow tier holds the golden puzzles (a changed hash
      # means ALGO_VERSION has to be bumped). A hotfix branch or a rollback commit may never have
      # had a green webapp-ci run. The commit defines its gate (release:gate); the workflow only
      # knows that one name. Commits older than the entry get the gate as far as they have it.
      - name: Checks
        working-directory: webapp
        run: |
          has() { node -e 'process.exit(require("./package.json").scripts[process.argv[1]] ? 0 : 1)' "$1"; }
          if has release:gate; then
            npm run release:gate
          else   # delete this branch once release:gate is 7 days (SOAK_DAYS) old on main
            npm run check
            if has test:all; then npm run test:all; else npm test; fi
            if has test:themes; then npm run test:themes; fi
          fi

      # The puzzles are data that gotd.yml releases without a soak: the tree id of demo/GameOfDay
      # on main, whatever commit the code comes from.
      - name: Puzzles of main
        run: |
          set -euo pipefail
          echo "PUZZLES=$(git rev-parse --verify origin/main:demo/GameOfDay)" >> "$GITHUB_ENV"

      - name: Stage the play app
        run: bash "$RUNNER_TEMP/ctl/stage-prod.sh" dist "$SHA" "$PUZZLES"

      # The code to deploy has to read the upcoming puzzles. Too few puzzles do not stop this
      # release: that is the alarm of gotd.yml.
      - name: Puzzles fit the code
        run: node "$RUNNER_TEMP/ctl/check-puzzles.mjs" dist/zigzag/demo/GameOfDay

      - name: Deploy to Cloudflare
        if: ${{ needs.select.outputs.dry != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes "$WRANGLER" deploy --config deploy/cloudflare/wrangler.toml

      - name: Smoke test
        id: smoke
        if: ${{ needs.select.outputs.dry != 'true' && needs.select.outputs.smoke == 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash "$RUNNER_TEMP/ctl/smoke-site.sh" \
            https://play.vintoshine.com/zigzag dist/zigzag "$SHA" "$PUZZLES"

      # Last on purpose: a failure here can never skip the smoke test or the rollback. The tags
      # are made with the REST API, not with `git push`: GitHub refuses a push of a commit that
      # changes a file under .github/workflows to the workflow token, which can never hold the
      # `workflows` permission (see deploy/README.md).
      - name: Record the deploy (tags)
        if: ${{ needs.select.outputs.dry != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          tag="deploy/$(date -u +%Y%m%dT%H%M%SZ)"
          gh api "$refs" -f ref="refs/tags/$tag" -f sha="$SHA" --silent
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/prod" --silent 2>/dev/null; then
            gh api -X PATCH "$refs/tags/prod" -f sha="$SHA" -F force=true --silent
          else   # the first deploy
            gh api "$refs" -f ref=refs/tags/prod -f sha="$SHA" --silent
          fi
          echo "Tagged $tag and prod"

      # The run stays red, but the site is back on the version that was live before. The tags
      # were not moved yet (they follow a green smoke test), so they still name that version.
      - name: Roll back to the previous version
        if: >-
          ${{ failure() && steps.smoke.conclusion == 'failure'
          && needs.select.outputs.live != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$LIVE"
          rm -rf deploy/cloudflare
          mkdir -p deploy
          cp -a "$RUNNER_TEMP/ctl/cloudflare" deploy/cloudflare
          bash "$RUNNER_TEMP/ctl/stage-prod.sh" dist "$LIVE" "$PUZZLES"
          npx --yes "$WRANGLER" deploy --config deploy/cloudflare/wrangler.toml
          echo "::error::The smoke test failed: rolled back to ${LIVE:0:7}"

      - name: Summary
        if: always()
        env:
          REASON: ${{ needs.select.outputs.reason }}
          DRY: ${{ needs.select.outputs.dry }}
        run: |
          {
            echo "### Production deploy"
            echo "- commit: \`${SHA:0:7}\`, live before: \`${LIVE:0:7}\`, dry run: $DRY"
            echo "- puzzles of main: \`${PUZZLES:0:7}\`"
            echo "- reason: $REASON"
            echo "- earlier deploys, for a rollback (run again with one as ref):"
            git tag --list 'deploy/*' --sort=-refname | head -5 | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
