name: Production deploy

# Deploys the play app to https://play.vintoshine.com/zigzag/ (Cloudflare Workers static assets).
#  - Scheduled, every day: promotes the newest commit of main that has been there for
#    SOAK_DAYS, on RELEASE_DAYS only, and only with DRY_RUN=false (otherwise it checks and
#    stages, nothing more). The rules are in .github/scripts/select-release.sh.
#  - Manual: Actions -> Production deploy -> Run workflow (any commit of main or of a
#    hotfix/* branch, no waiting, e.g. a hotfix or a rollback).
# The code comes from the chosen commit; the deploy config and the scripts come from the commit
# this workflow runs on, so an old commit (rollback) deploys the same way. See deploy/README.md.

run-name: >-
  ${{ github.event_name == 'schedule' && 'prod scheduled promote'
  || format('prod {0} - {1}', inputs.ref, inputs.reason) }}

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (must be on main or on a hotfix/* branch)
        required: true
        default: main
      reason:
        description: Why (shown in the run summary)
        required: true
      dry_run:
        description: Run the checks and stage the site, deploy nothing
        type: boolean
        default: false
      smoke:
        description: Smoke test after the deploy (off only for the very first deploy)
        type: boolean
        default: true

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4   # pin the exact version printed in a deploy log, e.g. wrangler@4.x.y

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.sel.outputs.run }}
      sha: ${{ steps.sel.outputs.sha }}
      live: ${{ steps.sel.outputs.live }}
      dry: ${{ steps.sel.outputs.dry }}
      smoke: ${{ steps.sel.outputs.smoke }}
      strict: ${{ steps.sel.outputs.strict }}
      reason: ${{ steps.sel.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select what to deploy
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          REASON: ${{ inputs.reason }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SMOKE_INPUT: ${{ inputs.smoke }}
          PROD_FREEZE: ${{ vars.PROD_FREEZE }}
          SOAK_DAYS: ${{ vars.SOAK_DAYS }}
          RELEASE_DAYS: ${{ vars.RELEASE_DAYS }}
          DRY_RUN_VAR: ${{ vars.DRY_RUN }}
        run: bash .github/scripts/select-release.sh

  deploy:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # moves the tags; no step stores the token, only the tag steps get it
    environment:
      name: production
      url: https://play.vintoshine.com/zigzag/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ needs.select.outputs.sha }}
      LIVE: ${{ needs.select.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the commit to deploy
        run: |
          set -euo pipefail
          # deploy config and scripts: from the commit of this run, not from the one deployed
          mkdir -p "$RUNNER_TEMP/ctl"
          cp -a deploy/cloudflare .github/scripts/smoke-site.sh .github/scripts/stage-prod.sh \
            "$RUNNER_TEMP/ctl/"
          git checkout --quiet --detach "$SHA"
          rm -rf deploy/cloudflare
          mkdir -p deploy
          cp -a "$RUNNER_TEMP/ctl/cloudflare" deploy/cloudflare

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checks
        working-directory: webapp
        run: |
          npm run check
          npm test
          npm run test:themes

      - name: Stage the play app
        run: bash "$RUNNER_TEMP/ctl/stage-prod.sh" dist "$SHA"

      - name: Puzzle buffer
        env:
          MIN: ${{ vars.MIN_PUZZLE_DAYS }}
          STRICT: ${{ needs.select.outputs.strict }}
        run: |
          min=${MIN:-10}
          n=0
          while [ -f "dist/zigzag/demo/GameOfDay/$(date -u -d "+$n day" +%Y%m%d).txt" ]; do
            n=$((n + 1))
          done
          echo "Game of Day puzzles ahead, counted from today (UTC): $n"
          if [ "$n" -lt "$min" ]; then
            if [ "$STRICT" = true ]; then
              echo "::error::only $n puzzles ahead, fewer than MIN_PUZZLE_DAYS=$min: add puzzles"
              exit 1
            fi
            echo "::warning::only $n puzzles ahead, fewer than MIN_PUZZLE_DAYS=$min"
          fi

      - name: Deploy to Cloudflare
        if: ${{ needs.select.outputs.dry != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes "$WRANGLER" deploy --config deploy/cloudflare/wrangler.toml

      - name: Record the deploy (tags)
        if: ${{ needs.select.outputs.dry != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tag="deploy/$(date -u +%Y%m%dT%H%M%SZ)"
          git push --quiet "$url" "$SHA:refs/tags/$tag" "+$SHA:refs/tags/prod"
          echo "Tagged $tag and prod"

      - name: Smoke test
        id: smoke
        if: ${{ needs.select.outputs.dry != 'true' && needs.select.outputs.smoke == 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash "$RUNNER_TEMP/ctl/smoke-site.sh" \
            https://play.vintoshine.com/zigzag dist/zigzag "$SHA"

      # The run stays red, but the site is back on the version that was live before.
      - name: Roll back to the previous version
        if: >-
          ${{ failure() && steps.smoke.conclusion == 'failure'
          && needs.select.outputs.live != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$LIVE"
          rm -rf deploy/cloudflare
          mkdir -p deploy
          cp -a "$RUNNER_TEMP/ctl/cloudflare" deploy/cloudflare
          bash "$RUNNER_TEMP/ctl/stage-prod.sh" dist "$LIVE"
          npx --yes "$WRANGLER" deploy --config deploy/cloudflare/wrangler.toml
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tag="deploy/$(date -u +%Y%m%dT%H%M%SZ)"
          git push --quiet "$url" "$LIVE:refs/tags/$tag" "+$LIVE:refs/tags/prod"
          echo "::error::The smoke test failed: rolled back to ${LIVE:0:7}"

      - name: Summary
        if: always()
        env:
          REASON: ${{ needs.select.outputs.reason }}
          DRY: ${{ needs.select.outputs.dry }}
        run: |
          {
            echo "### Production deploy"
            echo "- commit: \`${SHA:0:7}\`, live before: \`${LIVE:0:7}\`, dry run: $DRY"
            echo "- reason: $REASON"
            echo "- earlier deploys, for a rollback (run again with one as ref):"
            git tag --list 'deploy/*' --sort=-refname | head -5 | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
