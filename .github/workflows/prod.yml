name: Production deploy

# Deploys the play app to https://play.vintoshine.com/zigzag/ (Cloudflare Workers static assets).
# Manual: Actions -> Production deploy -> Run workflow. See deploy/README.md.
# The code comes from `ref` (main or a hotfix/* branch); the deploy config and the smoke test
# come from the commit this workflow runs on, so an old `ref` (rollback) deploys the same way.

run-name: prod ${{ inputs.ref }} - ${{ inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (must be on main or on a hotfix/* branch)
        required: true
        default: main
      reason:
        description: Why (shown in the run summary)
        required: true
      dry_run:
        description: Run the checks and stage the site, deploy nothing
        type: boolean
        default: false
      smoke:
        description: Smoke test after the deploy (off only for the very first deploy)
        type: boolean
        default: true

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # moves the tags; no step stores the token, only the tag step gets it
    environment:
      name: production
      url: https://play.vintoshine.com/zigzag/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the ref
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" ||
                git rev-parse --verify --quiet "$REF^{commit}") ||
            { echo "::error::cannot resolve '$REF'"; exit 1; }
          on=$(git branch -r --contains "$sha" | grep -cE '^\s*origin/(main|hotfix/.+)$' || true)
          [ "$on" -gt 0 ] ||
            { echo "::error::$sha is on neither main nor a hotfix/* branch"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # deploy config and smoke test: from the commit of this run, not from `ref`
          mkdir -p "$RUNNER_TEMP/ctl"
          cp -a deploy/cloudflare .github/scripts/smoke-site.sh "$RUNNER_TEMP/ctl/"
          git checkout --quiet --detach "$sha"
          rm -rf deploy/cloudflare
          mkdir -p deploy
          cp -a "$RUNNER_TEMP/ctl/cloudflare" deploy/cloudflare

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checks
        working-directory: webapp
        run: |
          npm run check
          npm test
          npm run test:themes

      - name: Stage the play app
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/stage-site.sh _site
          # Play app only: no design or stats page, no old demo pages (nothing links to them).
          rm -f _site/webapp/design.html _site/webapp/stats.html \
            _site/demo/index.html _site/demo/design.html
          rm -rf dist
          mkdir -p dist/zigzag
          cp -a _site/. dist/zigzag/
          cp deploy/cloudflare/_headers deploy/cloudflare/_redirects dist/
          printf '_headers\n_redirects\n' > dist/.assetsignore
          version=$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" webapp/src/version.js)
          printf '{"sha":"%s","version":"%s","built":"%s"}\n' \
            "$SHA" "$version" "$(date -u +%FT%TZ)" > dist/zigzag/build.json
          echo "Staged $(find dist -type f | wc -l) files, version $version"

      - name: Puzzle buffer
        env:
          MIN: ${{ vars.MIN_PUZZLE_DAYS }}
        run: |
          min=${MIN:-10}
          n=0
          while [ -f "dist/zigzag/demo/GameOfDay/$(date -u -d "+$n day" +%Y%m%d).txt" ]; do
            n=$((n + 1))
          done
          echo "Game of Day puzzles ahead, counted from today (UTC): $n"
          [ "$n" -ge "$min" ] ||
            echo "::warning::only $n puzzles ahead, fewer than MIN_PUZZLE_DAYS=$min"

      - name: Deploy to Cloudflare
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 deploy --config deploy/cloudflare/wrangler.toml

      - name: Record the deploy (tags)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tag="deploy/$(date -u +%Y%m%dT%H%MZ)"
          git push --quiet "$url" "$SHA:refs/tags/$tag" "+$SHA:refs/tags/prod"
          echo "Tagged $tag and prod"

      - name: Smoke test
        if: ${{ !inputs.dry_run && inputs.smoke }}
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bash "$RUNNER_TEMP/ctl/smoke-site.sh" \
            https://play.vintoshine.com/zigzag dist/zigzag "$SHA"

      - name: Summary
        if: always()
        env:
          REF: ${{ inputs.ref }}
          REASON: ${{ inputs.reason }}
          SHA: ${{ steps.ref.outputs.sha }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Production deploy"
            echo "- ref: \`$REF\` (\`${SHA:0:7}\`), dry run: $DRY"
            echo "- reason: $REASON"
            echo "- earlier deploys, for a rollback (run again with one as ref):"
            git tag --list 'deploy/*' --sort=-refname | head -5 | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
