name: Webapp CI

# The site is the repository root: index.html, assets/, demo/ and webapp/, plus the theme files that stage-site.sh builds from themes/
# (packed bundles and their manifest; the sources stay in the repository). Checks and unit tests run on every
# push and pull request that touches any of it, or this workflow. When they pass, a push to main (or a manual
# run on main) deploys to GitHub Pages: only the allowlist in .github/scripts/stage-site.sh is published.
# The benchmark is slower and its timings depend on the runner, so it only runs on the default branch and on
# demand (Actions tab -> Webapp CI -> Run workflow). It does not gate the deployment.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'demo/**'
      - 'webapp/**'
      - 'themes/**'
      - '.github/workflows/webapp-ci.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'demo/**'
      - 'webapp/**'
      - 'themes/**'
      - '.github/workflows/webapp-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel a run on main: it may be deploying

permissions:
  contents: read

# Every `run` step below executes inside webapp/.
defaults:
  run:
    working-directory: webapp

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Every file parses, every import and html reference resolves. The app entry points
      # need a browser, so the unit tests never load them. Also fails if a token in config.js
      # can do more than read and insert.
      - name: Syntax and import check
        run: npm run check

      # Node 20 runs the fast tier: the tests that are not marked slow (test/harness.js), under a minute.
      - name: Unit tests (fast tier)
        if: matrix.node == 20
        run: npm test

      # Node 22 runs every test. The slow tier includes the golden puzzles: a changed hash means the generator
      # output changed and ALGO_VERSION has to be bumped (see README).
      - name: Unit tests (all tiers)
        if: matrix.node == 22
        run: npm run test:all

      # The themes themselves: every one packs into a bundle the app accepts, contrast, budgets, the site build.
      - name: Theme tests
        if: matrix.node == 22
        run: npm run test:themes

      # The rules that pick what production deploys (.github/scripts/select-release.sh).
      - name: Release selection self-test
        if: matrix.node == 22
        run: bash ../.github/scripts/test-select-release.sh

      # The rules that pick when the Game of Day puzzles are released (.github/scripts/select-puzzles.sh)
      # and the check that the code reads them (.github/scripts/check-puzzles.mjs).
      - name: Puzzle release self-test
        if: matrix.node == 22
        run: bash ../.github/scripts/test-select-puzzles.sh

      # The puzzle window of the production site (GOTD_AHEAD, .github/scripts/stage-prod.sh).
      - name: Puzzle window self-test
        if: matrix.node == 22
        run: bash ../.github/scripts/test-stage-prod.sh

      # What the deploy job publishes: an allowlist, then a scan for files and secrets that must never ship.
      - name: Dry-run site staging
        if: matrix.node == 22
        working-directory: .
        run: bash .github/scripts/stage-site.sh "$RUNNER_TEMP/site"

      # The production folder with the puzzles laid over it from a tree id, as prod.yml and gotd.yml
      # stage it; the puzzles of this commit have to be readable by this code.
      - name: Dry-run production staging
        if: matrix.node == 22
        working-directory: .
        run: |
          puzzles=$(git rev-parse HEAD:demo/GameOfDay)
          bash .github/scripts/stage-prod.sh "$RUNNER_TEMP/dist" "$(git rev-parse HEAD)" "$puzzles"
          grep -q "\"puzzles\":\"$puzzles\"" "$RUNNER_TEMP/dist/zigzag/build.json"
          node .github/scripts/check-puzzles.mjs "$RUNNER_TEMP/dist/zigzag/demo/GameOfDay"

  bench:
    name: Benchmark
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Fails if the solver's pruning options ever change the solutions found.
      - name: Run benchmark
        run: npm run bench | tee bench-output.txt

      - name: Show results in the job summary
        if: always()
        run: |
          {
            echo '### Benchmark'
            echo '```'
            cat bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-output
          path: webapp/bench-output.txt

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test            # same commit, same workflow: what was tested is what ships
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    permissions:           # job-level replaces workflow-level: least privilege for this job only
      contents: read
      pages: write
      id-token: write      # lets deploy-pages prove its identity (OIDC)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Stage allowlisted files
        run: bash .github/scripts/stage-site.sh _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The query string bypasses the CDN cache, which may still hold files of the old branch deployment.
      # The theme files are every file of the staged theme folder: the manifest and each bundle must be served.
      # What must stay private is checked with retries: a 503 of the host right after the deploy is no verdict.
      - name: Smoke test
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          base="${URL%/}"
          themes=$(node themes/tools/build-site.mjs --dir)
          for p in index.html webapp/index.html webapp/src/config.js $(cd _site && find "$themes" -type f); do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$base/$p?cb=$RUN_ID"
          done
          bash .github/scripts/assert-private.sh "$base" webapp/package.json webapp/server/README.md \
            webapp/tools/ratings.json themes/candy/theme.json
